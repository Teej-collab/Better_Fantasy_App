<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=390, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Neon Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="cosmic-layer" id="cosmic-layer" aria-hidden="true"></div>
    <main id="view"></main>
    <nav class="tabbar glass" id="tabbar" aria-label="Primary">
      <button class="tab-btn" data-route="home" data-nav="home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tlabel">Home</span>
      </button>
      <button class="tab-btn" data-route="matchup" data-nav="matchup">
        <span class="tab-live-dot" aria-hidden="true"></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12h4l2-5 4 10 2-5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tlabel">Matchup</span>
      </button>
      <button class="tab-btn" data-route="roster" data-nav="roster">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="2"/><path d="M5 20c1-3.8 4-6 7-6s6 2.2 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="tlabel">Team</span>
      </button>
      <button class="tab-btn" data-route="standings" data-nav="standings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 10v10" stroke="currentColor" stroke-width="2"/></svg>
        <span class="tlabel">League</span>
      </button>
      <button class="tab-btn" data-route="chat" data-nav="chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H9l-4 4V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="tlabel">Chat</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>

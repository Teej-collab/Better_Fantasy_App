/* ==========================================================================
   NEON ORBIT — THE WEEKEND, concept 04
   Real brand: cosmic violet-black ground + signature #39ff14 neon green.
   Liquid glass chrome + rotating conic-gradient ring motif.
   Fixed 390px mobile canvas. No desktop breakpoints, by design.
   ========================================================================== */

@property --panel-border-angle {
  syntax: "<angle>";
  inherits: true;
  initial-value: 0deg;
}

:root {
  /* ---- brand tokens (pulled from production globals.css) ---- */
  --neon: #39ff14;
  --neon-dim: #1f890b;
  --live: #ef4444;
  --bg: #0a0716;
  --surface: #171129;
  --surface-2: #1d1734;
  --border: #35285f;

  /* ---- derived text tokens ---- */
  --text-1: #f6f4fb;
  --text-2: #b8adcf;
  --text-3: #7c7196;

  /* ---- glass tokens ---- */
  --glass-bg: rgba(23, 17, 41, 0.62);
  --glass-bg-strong: rgba(23, 17, 41, 0.78);
  --glass-border-hi: rgba(255, 255, 255, 0.14);
  --glass-border-lo: rgba(57, 255, 20, 0.10);
  --glass-blur: 28px;

  /* ---- radii / spacing ---- */
  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;
  --r-pill: 999px;

  /* ---- fonts ---- */
  --font-display: "Space Grotesk", "Barlow Condensed", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;

  color-scheme: dark;
  animation: panel-border-rotate 5s linear infinite;
}

@keyframes panel-border-rotate {
  to { --panel-border-angle: 360deg; }
}

/* ==========================================================================
   Reset / base
   ========================================================================== */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  margin: 0;
  letter-spacing: -0.01em;
}

p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
button { font-family: inherit; }
a { color: inherit; text-decoration: none; }

button, .tap {
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.mono-num { font-variant-numeric: tabular-nums; }

/* ==========================================================================
   App shell — fixed 390px mobile canvas
   ========================================================================== */

.app-shell {
  position: relative;
  width: 390px;
  max-width: 100vw;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  overflow-x: hidden;
  isolation: isolate;
}

/* sparse stars + restrained nebula glow — only mounted behind key screens */
.cosmic-layer {
  position: fixed;
  inset: 0;
  width: 390px;
  max-width: 100vw;
  margin: 0 auto;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.cosmic-layer.is-active { opacity: 1; }
.cosmic-layer::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.9), transparent),
    radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 34% 62%, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 92% 40%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 58% 82%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 8% 90%, rgba(255,255,255,0.55), transparent),
    radial-gradient(1px 1px at 68% 30%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 22% 40%, rgba(255,255,255,0.4), transparent);
  opacity: 0.7;
}
.cosmic-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(320px 220px at 20% -6%, rgba(57,255,20,0.16), transparent 70%),
    radial-gradient(280px 260px at 100% 20%, rgba(124,86,214,0.20), transparent 70%),
    radial-gradient(260px 240px at 10% 95%, rgba(57,255,20,0.08), transparent 70%);
}

main#view {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: 108px; /* clears the floating tab bar */
}

/* ==========================================================================
   Liquid glass primitive
   ========================================================================== */

.glass {
  position: relative;
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(170%);
  backdrop-filter: blur(var(--glass-blur)) saturate(170%);
  border: 1px solid var(--glass-border-hi);
  border-radius: var(--r-lg);
  box-shadow:
    0 10px 34px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.08),
    inset 0 -1px 0 rgba(0, 0, 0, 0.25);
}

.glass-strong {
  background: var(--glass-bg-strong);
}

/* diagonal light-catching edge overlay, low opacity */
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, transparent 30%, transparent 70%, rgba(57,255,20,0.06) 100%);
  pointer-events: none;
}

@media (prefers-reduced-transparency: reduce) {
  .glass, .glass-strong {
    background: var(--surface);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

/* ==========================================================================
   Rotating neon ring — signature motif, used sparingly (one hero/screen)
   ========================================================================== */

.ring-card { position: relative; }
.ring-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: conic-gradient(
    from var(--panel-border-angle),
    transparent 0deg,
    color-mix(in srgb, var(--neon) 95%, transparent) 90deg,
    transparent 180deg,
    transparent 360deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
  z-index: 2;
}

.ring-badge {
  position: relative;
  width: 84px;
  height: 84px;
  border-radius: 50%;
}
.ring-badge::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 2px;
  background: conic-gradient(
    from var(--panel-border-angle),
    transparent 0deg,
    color-mix(in srgb, var(--neon) 95%, transparent) 100deg,
    transparent 200deg,
    transparent 360deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
}

@media (prefers-reduced-motion: reduce) {
  :root { animation: none; }
}

/* ==========================================================================
   Specular highlight — one deliberate detail, subtle
   ========================================================================== */

.specular { position: relative; overflow: hidden; }
.specular::before {
  content: "";
  position: absolute;
  top: -50%;
  left: var(--sweep-x, -60%);
  width: 45%;
  height: 200%;
  background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.14) 48%, transparent 76%);
  transform: rotate(8deg);
  transition: left 0.5s ease-out;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  .specular::before { transition: none; }
}

/* ==========================================================================
   Type scale
   ========================================================================== */

.display-1 { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; }
.display-2 { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
.h-1 { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.h-2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }
.body-sm { font-size: 13px; color: var(--text-2); }
.text-neon { color: var(--neon); }
.text-2 { color: var(--text-2); }
.text-3 { color: var(--text-3); }
.text-live { color: var(--live); }

/* ==========================================================================
   Buttons / chips
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 50px;
  padding: 0 22px;
  border-radius: var(--r-pill);
  border: none;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--neon), var(--neon-dim));
  color: #04170a;
  box-shadow: 0 0 0 1px rgba(57,255,20,0.4), 0 10px 26px rgba(57,255,20,0.28);
  --sweep-x: -60%;
}
.btn-primary:active { filter: brightness(0.95); }

.btn-ghost {
  background: rgba(255,255,255,0.05);
  color: var(--text-1);
  border: 1px solid var(--border);
}

.btn-block { width: 100%; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text-2);
}
.chip-live {
  background: rgba(239,68,68,0.14);
  border-color: rgba(239,68,68,0.4);
  color: #ff9d9d;
}
.dot-live {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--live);
  box-shadow: 0 0 8px rgba(239,68,68,0.9);
  animation: pulse-live 1.6s ease-in-out infinite;
}
@keyframes pulse-live {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.8); }
}
@media (prefers-reduced-motion: reduce) {
  .dot-live { animation: none; }
}

/* ==========================================================================
   Cards / layout blocks
   ========================================================================== */

.screen {
  padding: 0 0 24px;
}

.page-pad { padding-left: 20px; padding-right: 20px; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 14px;
  margin-bottom: 4px;
}
.topbar.glass {
  border-radius: 0 0 var(--r-md) var(--r-md);
  border-top: none;
}

.avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2);
  border: 1px solid var(--border);

  font-weight: 700;
  font-size: 13px;
  color: var(--neon);
  flex-shrink: 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px;
}

.section {
  padding: 20px 20px 0;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.link-more {
  font-size: 12px;
  font-weight: 600;
  color: var(--neon);
}

/* Home hero matchup preview */
.hero-matchup {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

}

.hero-vs {

.winprob-track {

}
.winprob-fill {

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.quick-item {
  display: flex;
  flex-direction: column;

/* standings mini + full */

  gap: 10px;
  padding: 11px 0;

.standing-row.is-user { background: rgba(57,255,20,0.05); border-radius: 10px; padding-left: 8px; padding-right: 8px; margin: 0 -8px; }
.rank-num { font-family: var(--font-display); font-size: 13px; color: var(--text-3); }

}

  border-radius: 50%;

     ------------------------------------------------------------------ */

  const state = { benchOpen: false, chatTab: "league", chatMsgs: { league: CHAT_LEAGUE.slice(), dm: CHAT_DM.slice() }, waivers: WAIVERS.map(w => ({ ...w })), sortKey: "pf" };

  function currentRoute() {
    const hash = location.hash.replace(/^#\//, "");
    return hash || "splash";
  }

  function navigate(route) {
    location.hash = "#/" + route;
  }

  function render() {
    const route = currentRoute();
    const [base, arg] = route.split("/");
    const view = document.getElementById("view");
    const tabbar = document.getElementById("tabbar");
    const cosmic = document.getElementById("cosmic-layer");

    let html = "";
    let showTabs = true;
    let cosmicOn = false;

    switch (base) {
      case "splash":
        html = renderSplash();
        showTabs = false;
        cosmicOn = true;
        break;
      case "home":
        html = renderHome();
        cosmicOn = true;
        break;
      case "matchup":
        html = renderMatchup();
        break;
      case "roster":
        html = renderRoster();
        break;
      case "standings":
        html = renderStandings();
        break;
      case "player":
        html = renderPlayer(arg);
        break;
      case "waivers":
        html = renderWaivers();
        break;
      case "chat":
        html = renderChat();
        break;
      default:
        html = renderSplash();
        showTabs = false;
        cosmicOn = true;
    }

    view.innerHTML = html;
    tabbar.style.display = showTabs ? "flex" : "none";
    cosmic.classList.toggle("is-active", cosmicOn);

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.route === base);
    });

    window.scrollTo(0, 0);
    wireView(base);
  }

  /* ------------------------------------------------------------------
     Interaction wiring per view
     ------------------------------------------------------------------ */

  function wireView(base) {
    document.querySelectorAll("[data-nav]").forEach((el) => {
      el.addEventListener("click", () => navigate(el.dataset.nav));
    });

    const backBtn = document.getElementById("back-btn");
    if (backBtn) backBtn.addEventListener("click", () => history.back());

    if (base === "roster") {
      const toggle = document.getElementById("bench-toggle-btn");
      const list = document.getElementById("bench-list");
      const chevron = document.getElementById("bench-chevron");
      if (toggle) {
        list.classList.toggle("is-open", state.benchOpen);
        chevron.classList.toggle("is-open", state.benchOpen);
        toggle.addEventListener("click", () => {
          state.benchOpen = !state.benchOpen;
          list.classList.toggle("is-open", state.benchOpen);
          chevron.classList.toggle("is-open", state.benchOpen);
        });
      }
    }

    if (base === "standings") {
      document.querySelectorAll("[data-sort]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.sortKey = btn.dataset.sort;
          render();
        });
      });
    }

    if (base === "waivers") {
      let bidAmount = 10;
      let activeClaimId = null;
      const backdrop = document.getElementById("claim-sheet-backdrop");
      const amountEl = document.getElementById("bid-amount");
      const titleEl = document.getElementById("claim-sheet-title");
      const subEl = document.getElementById("claim-sheet-sub");
      const toast = document.getElementById("claim-toast");
      const toastText = document.getElementById("claim-toast-text");

      document.querySelectorAll("[data-claim]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const w = state.waivers.find((x) => x.id === btn.dataset.claim);
          if (!w || w.claimed) return;
          activeClaimId = w.id;
          bidAmount = w.faab;
          amountEl.textContent = bidAmount;
          titleEl.textContent = "Place FAAB bid";
          subEl.textContent = `${w.name} · ${w.pos} · ${w.team}`;
          backdrop.classList.add("is-open");
        });
      });
      const closeSheet = () => backdrop.classList.remove("is-open");
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeSheet(); });
      document.getElementById("bid-minus").addEventListener("click", () => {
        bidAmount = Math.max(1, bidAmount - 1);
        amountEl.textContent = bidAmount;
      });
      document.getElementById("bid-plus").addEventListener("click", () => {
        bidAmount = Math.min(62, bidAmount + 1);
        amountEl.textContent = bidAmount;
      });
      document.getElementById("confirm-claim").addEventListener("click", () => {
        const w = state.waivers.find((x) => x.id === activeClaimId);
        if (w) {
          w.claimed = true;
          w.faab = bidAmount;
        }
        closeSheet();
        toastText.textContent = `Claim submitted — $${bidAmount} bid`;
        toast.classList.add("is-open");
        setTimeout(() => toast.classList.remove("is-open"), 2200);
        const btnEl = document.querySelector(`[data-claim="${activeClaimId}"]`);
        if (btnEl) { btnEl.textContent = "Claimed"; btnEl.classList.add("claimed"); }
      });
    }

    if (base === "chat") {
      document.querySelectorAll("[data-chat-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.chatTab = btn.dataset.chatTab;
          render();
        });
      });
      const input = document.getElementById("chat-input");
      const send = document.getElementById("chat-send");
      const scroll = document.getElementById("chat-scroll");
      const doSend = () => {
        const text = input.value.trim();
        if (!text) return;
        state.chatMsgs[state.chatTab].push({ who: "Tyler", mine: true, text });
        input.value = "";
        render();
        const el = document.getElementById("chat-scroll");
        if (el) el.scrollTop = el.scrollHeight;
      };
      send.addEventListener("click", doSend);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") doSend(); });
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
    }
  }

  /* ------------------------------------------------------------------
     Specular sweep — fine pointers only, respects reduced motion
     ------------------------------------------------------------------ */

  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hasFinePointer = window.matchMedia("(pointer: fine)").matches;

  if (!prefersReducedMotion && hasFinePointer) {
    document.addEventListener("pointermove", (e) => {
      document.querySelectorAll(".specular").forEach((el) => {
        const rect = el.getBoundingClientRect();
        if (e.clientX < rect.left - 40 || e.clientX > rect.right + 40) return;
        const pct = ((e.clientX - rect.left) / rect.width) * 100;
        el.style.setProperty("--sweep-x", `${Math.max(-60, Math.min(140, pct))}%`);
      });
    });
  }

  /* ------------------------------------------------------------------
     Init
     ------------------------------------------------------------------ */

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", () => {
    if (!location.hash) location.hash = "#/splash";
    render();
  });
})();

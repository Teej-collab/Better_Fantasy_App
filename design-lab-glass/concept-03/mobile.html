<style>
/* ==========================================================================
   THE HUDDLE — liquid-glass, mobile-first, fixed 390px canvas
   ========================================================================== */

* , *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: dark;

  /* ---- named tokens (6) ------------------------------------------------ */
  --ground:     #1B120D; /* worn-oak / dark leather ground              */
  --surface:    #2C2016; /* warm elevated surface (locker wood)         */
  --gold:       #E8AE4D; /* team gold — primary accent / positive       */
  --ember:      #D9622B; /* burnt orange — secondary / rivalry energy   */
  --rally-red:  #C43B2E; /* alerts, losses, live-danger                 */
  --cream:      #F5E9D6; /* warm off-white — text on dark                */

  /* ---- derived ----------------------------------------------------------*/
  --cream-70: rgba(245,233,214,0.70);
  --cream-50: rgba(245,233,214,0.50);
  --cream-30: rgba(245,233,214,0.30);
  --cream-14: rgba(245,233,214,0.14);
  --cream-08: rgba(245,233,214,0.08);

  --glass-bg: rgba(27,18,13,0.62);
  --glass-bg-strong: rgba(27,18,13,0.78);
  --glass-bg-light: rgba(56,39,24,0.46);
  --glass-border-a: rgba(255,255,255,0.55);
  --glass-border-b: rgba(255,255,255,0.04);

  --radius-xl: 30px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;

  --shadow-lift: 0 18px 40px -12px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
  --shadow-card: 0 10px 24px -10px rgba(0,0,0,0.5);

  --mx: 50%;
  --my: 0%;
}

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--cream);
  font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

h1, h2, h3, h4, .display {
  font-family: 'Barlow Condensed', 'Barlow', sans-serif;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 0;
  text-transform: none;
}

p { margin: 0; }
button { font-family: inherit; }
img { max-width: 100%; display: block; }

::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }

/* ==========================================================================
   Frame — the fixed 390px phone canvas. This is not a desktop breakpoint;
   it is THE canvas per the design brief.
   ========================================================================== */

#stage {
  min-height: 100dvh;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(217,98,43,0.10), transparent 60%),
    var(--ground);
  padding: 0;
}

#frame {
  position: relative;
  width: 390px;
  max-width: 100vw;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--ground);
  isolation: isolate;
}

/* Ambient warm "locker room light" texture behind everything, so the glass
   layers always have rich, layered content to refract. */
#frame::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 40% at 15% 8%, rgba(232,174,77,0.16), transparent 60%),
    radial-gradient(70% 45% at 100% 0%, rgba(217,98,43,0.20), transparent 55%),
    radial-gradient(90% 60% at 50% 100%, rgba(196,59,46,0.10), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px);
}

/* ==========================================================================
   Glass system
   ========================================================================== */

.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(26px) saturate(170%);
  -webkit-backdrop-filter: blur(26px) saturate(170%);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  pointer-events: none;
  background: linear-gradient(135deg,
    var(--glass-border-a) 0%,
    var(--glass-border-b) 28%,
    rgba(255,255,255,0) 55%,
    rgba(255,255,255,0.16) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

.glass-strong {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(34px) saturate(180%);
  -webkit-backdrop-filter: blur(34px) saturate(180%);
}

.glass-light {
  background: var(--glass-bg-light);
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
  border-radius: var(--radius-md);
}

/* Top status / app bar ---------------------------------------------------- */

.topbar {
  flex-shrink: 0;
  z-index: 30;
  position: relative;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-radius: 0;
}
.topbar::before { border-radius: 0; }

.topbar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar .brand .mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: linear-gradient(155deg, var(--gold), var(--ember));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: #241505;
  box-shadow: 0 4px 10px rgba(217,98,43,0.35);
}
.topbar .brand .word {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.02em;
}
.topbar .subline {
  font-size: 11px;
  color: var(--cream-50);
  font-weight: 500;
  margin-top: 1px;
}

.avatar-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--cream-14);
  background: linear-gradient(155deg, #3a2a19, #241a10);
  color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
}

/* Main scroll area --------------------------------------------------------- */

main#view {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 16px calc(116px + env(safe-area-inset-bottom, 0px));
  scroll-behavior: smooth;
}

main#view.no-shell {
  padding: 0;
  overflow: hidden;
}

/* Bottom tab bar — floating true glass, with specular sweep -------------- */

.tabbar {
  position: absolute;
  left: 14px; right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  height: 66px;
  border-radius: var(--radius-xl);
  display: flex;
  align-items: stretch;
  justify-content: space-around;
  padding: 0 4px;
  overflow: hidden;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--shadow-lift);
}

.tabbar::after {
  content: "";
  position: absolute;
  inset: -20% -60%;
  pointer-events: none;
  background: linear-gradient(115deg,
    transparent 30%,
    rgba(255,255,255,0.07) 44%,
    rgba(255,255,255,0.16) 50%,
    rgba(255,255,255,0.07) 56%,
    transparent 70%);
  transform: translateX(-38%);
  animation: sweep 7s ease-in-out infinite;
}

@keyframes sweep {
  0%   { transform: translateX(-42%); }
  45%  { transform: translateX(18%); }
  55%  { transform: translateX(18%); }
  100% { transform: translateX(-42%); }
}

/* subtle pointer-follow lensing highlight (fine pointers only, via JS toggle) */
.tabbar.pointer-lens::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(120px 90px at var(--mx) var(--my), rgba(255,255,255,0.12), transparent 65%);
  z-index: 1;
}

.tab {
  position: relative;
  z-index: 2;
  flex: 1 1 0;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--cream-50);
  cursor: pointer;
  border-radius: var(--radius-md);
}
.tab .ico {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
}
.tab .lbl {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.tab.active {
  color: var(--gold);
}
.tab.active .ico {
  filter: drop-shadow(0 0 8px rgba(232,174,77,0.5));
}
.tab .dot {
  position: absolute;
  top: 6px; right: 22%;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--rally-red);
  box-shadow: 0 0 0 2px var(--glass-bg-strong);
}

/* ==========================================================================
   Typography helpers
   ========================================================================== */

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--gold);
}
.text-dim { color: var(--cream-50); }
.text-dim2 { color: var(--cream-70); }
.small { font-size: 12px; }
.tiny { font-size: 10.5px; }
.mono-score {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   Buttons & chips
   ========================================================================== */

.btn {
  appearance: none;
  border: none;
  cursor: pointer;
  min-height: 44px;
  padding: 0 20px;
  border-radius: 999px;
  font-family: 'Barlow', sans-serif;
  font-weight: 700;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary {
  background: linear-gradient(155deg, #F2C067, var(--gold) 55%, #C98A2D);
  color: #241505;
  box-shadow: 0 10px 22px -8px rgba(232,174,77,0.55);
}
.btn-primary:active { transform: translateY(1px) scale(0.99); }

.btn-ghost {
  background: var(--cream-08);
  color: var(--cream);
  border: 1px solid var(--cream-14);
}

.btn-ember {
  background: linear-gradient(155deg, #E9793E, var(--ember) 60%, #A6431A);
  color: #2A1105;
  box-shadow: 0 10px 22px -8px rgba(217,98,43,0.5);
}

.btn-sm {
  min-height: 36px;
  padding: 0 14px;
  font-size: 13px;
  border-radius: 999px;
}

.btn-block { width: 100%; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  min-height: 30px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--cream-08);
  border: 1px solid var(--cream-14);
  color: var(--cream-70);
  cursor: pointer;
}
.chip.on {
  background: rgba(232,174,77,0.18);
  border-color: rgba(232,174,77,0.55);
  color: var(--gold);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.badge-live {
  background: rgba(196,59,46,0.22);
  color: #FF9B85;
}
.badge-live .pip {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--rally-red);
  animation: pulse 1.6s ease-in-out infinite;
}
.badge-gold { background: rgba(232,174,77,0.18); color: var(--gold); }
.badge-ember { background: rgba(217,98,43,0.2); color: #FFA26C; }
.badge-dim { background: var(--cream-08); color: var(--cream-70); }

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

/* ==========================================================================
   Segmented control
   ========================================================================== */

.segmented {
  display: flex;
  padding: 4px;
  border-radius: 999px;
  background: var(--cream-08);
  border: 1px solid var(--cream-14);
  gap: 2px;
}
.segmented button {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--cream-50);
  font-weight: 700;
  font-size: 13px;
  min-height: 38px;
  border-radius: 999px;
  cursor: pointer;
}
.segmented button.active {
  background: linear-gradient(155deg, #F2C067, var(--gold));
  color: #241505;
}

/* ==========================================================================
   Cards / rows
   ========================================================================== */

.section {
  margin-top: 22px;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}
.section-head h2 {
  font-size: 20px;
}
.link-more {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--gold);
  background: none;
  border: none;
  cursor: pointer;
  min-height: 44px;
  display:flex; align-items:center;
}

.card {
  padding: 16px;
  margin-bottom: 12px;
}
.card-tap { cursor: pointer; }
.card-tap:active { transform: scale(0.985); }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
}
.row + .row {
  border-top: 1px solid var(--cream-08);
  padding-top: 12px;
  margin-top: 12px;
}

.crest {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  color: #241505;
  border-radius: 12px;
}
.crest-sm { width: 34px; height: 34px; font-size: 13px; border-radius: 10px; }
.crest-md { width: 44px; height: 44px; font-size: 16px; }
.crest-lg { width: 58px; height: 58px; font-size: 20px; border-radius: 16px; }

.pos-badge {
  width: 30px; height: 22px;
  flex-shrink: 0;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px;
  font-weight: 800;
  background: var(--cream-08);
  color: var(--cream-70);
  border: 1px solid var(--cream-14);
}

/* ==========================================================================
   Hero matchup card (Home + Gamecast)
   ========================================================================== */

.hero-score {
  padding: 18px;
  overflow: hidden;
}
.hero-score .rivalry-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 14px;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}
.hero-team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.hero-team .nm { font-size: 14px; font-weight: 700; }
.hero-team .own { font-size: 11px; color: var(--cream-50); }
.hero-score-num {
  font-size: 38px;
  line-height: 1;
}
.hero-vs { font-size: 12px; color: var(--cream-30); font-weight: 700; }

.winprob {
  margin-top: 16px;
}
.winprob .bar {
  height: 10px;
  border-radius: 999px;
  background: var(--cream-08);
  overflow: hidden;
  display: flex;
}
.winprob .fill-a { background: linear-gradient(90deg, var(--gold), #F2C067); }
.winprob .fill-b { background: linear-gradient(90deg, rgba(245,233,214,0.22), rgba(245,233,214,0.12)); }
.winprob .lbl-row {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 11px;
  color: var(--cream-50);
}

/* ==========================================================================
   Standings table
   ========================================================================== */

.standings-table { width: 100%; }
.standings-row {
  display: grid;
  grid-template-columns: 22px 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
}
.standings-row + .standings-row { border-top: 1px solid var(--cream-08); }
.standings-row.me { position: relative; }
.standings-row.me::before {
  content: "";
  position: absolute;
  left: -12px; right: -12px; top: -1px; bottom: -1px;
  background: rgba(232,174,77,0.09);
  border-radius: 12px;
  z-index: -1;
}
.rank { font-size: 12px; color: var(--cream-50); font-weight: 700; }
.team-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.team-cell .name-wrap { min-width: 0; }
.team-cell .nm { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-cell .owner { font-size: 11px; color: var(--cream-50); }
.rec-cell { text-align: right; font-size: 13px; font-weight: 700; }
.pf-cell { text-align: right; font-size: 11px; color: var(--cream-50); min-width: 52px; }
.streak-w { color: var(--gold); }
.streak-l { color: #FF9B85; }

/* ==========================================================================
   Chat
   ========================================================================== */

.chat-scroll {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 8px;
}
.pinned {
  padding: 12px 14px;
  margin-bottom: 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.bubble-wrap {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  max-width: 86%;
}
.bubble-wrap.mine {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.bubble {
  padding: 10px 13px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.35;
  background: var(--cream-08);
  border: 1px solid var(--cream-14);
}
.bubble-wrap.mine .bubble {
  background: linear-gradient(155deg, rgba(232,174,77,0.32), rgba(217,98,43,0.28));
  border-color: rgba(232,174,77,0.35);
}
.bubble-meta {
  font-size: 10.5px;
  color: var(--cream-30);
  margin: 3px 4px 0;
}
.bubble-wrap.mine .bubble-meta { text-align: right; }
.reactions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}
.reaction {
  border: 1px solid var(--cream-14);
  background: var(--cream-08);
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 11.5px;
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  min-height: 26px;

  const seedRand = (str) => {
    let x = 0;
    for (let i = 0; i < str.length; i++) x = (x * 31 + str.charCodeAt(i)) >>> 0;
    x = x || 1;
    return function () {
      x = (Math.imul(1103515245, x) + 12345) >>> 0;
      return (x % 10000) / 10000;
    };
  };

  function weeklyValue(player, week) {
    if (week === WEEK_CURRENT) return { val: player.actual, live: player.status !== "FINAL" && player.status !== "BYE" };
    const rnd = seedRand(player.id + "-w" + week)();
    const base = player.proj || player.season?.pg || 10;
    const val = Math.max(0, Math.round(base * (0.55 + rnd * 0.85) * 10) / 10);
    return { val, live: false };
  }

  /* ------------------------------------------------------------------ *
   * Pointer lensing for tab bar (fine pointers only — stays static on touch)
   * ------------------------------------------------------------------ */

  function wireTabBar() {
    const bar = document.getElementById("tabbar");
    if (!bar) return;
    if (!window.matchMedia("(pointer: fine)").matches) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    bar.classList.add("pointer-lens");
    bar.addEventListener("pointermove", (e) => {
      const rect = bar.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      bar.style.setProperty("--mx", x + "%");
      bar.style.setProperty("--my", y + "%");
    });
  }

  function wireGlobal() {
    const input = document.getElementById("chat-compose");
    if (input) {

              </div>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Bench</h2></div>
        <div class="glass card">
          ${MY_BENCH.map((id) => {
            const p = PLAYERS[id];
            const wv = weeklyValue(p, S.week);
            return `
            <div class="player-row bench-row" onclick="APP.openPlayer('${p.id}')">
              <span class="slot-tag">BN</span>
              ${crest(p.init, p.id, "sm")}
              <div class="player-info">
                <div class="nm">${p.name}</div>
                <div class="meta">${p.pos} &middot; ${p.nfl}</div>
              </div>
              <div class="player-pts">
                <div class="val">${wv.val}</div>
                <div class="lbl">pts</div>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="section">
        <div class="glass-light card">
          <div class="eyebrow">Draft recap</div>
          <p class="small mt-8">Grade <b style="color:var(--gold)">B+</b> &middot; 78th percentile. Highlight pick: Ja'Marr Chase, Round 1 Pick 3.</p>
        </div>
      </div>
    `;
  }

  /* ------------------------------------------------------------------ *
   * VIEW: League (standings / waivers segmented)
   * ------------------------------------------------------------------ */

  function viewLeague() {
    S.leagueTab = "standings";
    return `
      <div class="section" style="margin-top:6px;">
        <div class="section-head">
          <div><div class="eyebrow">The Weekend League</div><h2>League</h2></div>
        </div>
        <div class="segmented">
          <button class="${S.leagueTab === "standings" ? "active" : ""}" onclick="APP.setLeagueTab('standings')">Standings</button>
          <button class="${S.leagueTab === "waivers" ? "active" : ""}" onclick="APP.nav('#/waivers')">Waiver Wire</button>
        </div>
      </div>
      ${S.leagueTab === "standings" ? standingsBlock() : ""}
    `;
  }

  function standingsBlock() {
    return `
      <div class="section">
        <div class="glass card">
          <div class="standings-table">
            ${STANDINGS.map((t) => `
              <div class="standings-row${t.me ? " me" : ""}">
                <span class="rank">${t.rank}</span>
                <div class="team-cell">
                  ${crest(t.init, t.team, "sm")}
                  <div class="name-wrap">
                    <div class="nm">${t.team}${t.me ? " (you)" : ""}</div>
                    <div class="owner">${t.owner} &middot; <span class="${t.streak[0] === "W" ? "streak-w" : "streak-l"}">${t.streak}</span></div>
                  </div>
                </div>
                <div class="rec-cell">${t.rec}</div>
                <div class="pf-cell">${t.pf} PF</div>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-head"><h2>Rivalries</h2></div>
        <div class="glass card">
          <div class="row" style="border:none;padding-top:0;margin-top:0;">
            <span class="badge badge-ember">${ICO.bolt}</span>
            <div style="flex:1;">
              <div class="small" style="font-weight:700;">The Sunday Massacre</div>
              <div class="tiny text-dim">Turf Kings vs. Air Yard Sale &middot; Turf Kings lead 4-2 all-time</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  /* ------------------------------------------------------------------ *
   * VIEW: Waivers
   * ------------------------------------------------------------------ */

  function viewWaivers() {
    S.leagueTab = "waivers";
    return `
      <div class="section" style="margin-top:6px;">
        <div class="section-head">
          <div><div class="eyebrow">The Weekend League</div><h2>League</h2></div>
        </div>
        <div class="segmented">
          <button onclick="APP.nav('#/league')">Standings</button>
          <button class="active">Waiver Wire</button>
        </div>
      </div>

      <div class="section">
        <div class="glass-light card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div>
            <div class="small" style="font-weight:700;">Waivers process Wed, 8:00 PM</div>
            <div class="tiny text-dim">FAAB budget remaining: $86</div>
          </div>
          <span class="badge badge-gold">3d 6h</span>
        </div>
      </div>

      ${S.claims.length ? `
      <div class="section">
        <div class="section-head"><h2>My claims</h2></div>
        <div class="glass claims-strip">
          ${S.claims.map((c) => {
            const f = FREE_AGENTS.find((x) => x.id === c.id);
            return `<div class="claim-pill">
              <div class="flex items-center gap-10">
                ${crest(initials(f.name), f.id, "sm")}
                <div><div class="small" style="font-weight:700;">${f.name}</div><div class="tiny text-dim">$${c.bid} bid</div></div>
              </div>
              <button class="remove-x" onclick="APP.removeClaim('${c.id}')">${ICO.close}</button>
            </div>`;
          }).join("")}
        </div>
      </div>` : ""}

      <div class="section">
        <div class="section-head"><h2>Available</h2></div>
        <div class="glass card">
          ${FREE_AGENTS.map((f) => {
            const claimed = S.claims.find((c) => c.id === f.id);
            return `
            <div class="waiver-row">
              <div class="waiver-top">
                ${crest(initials(f.name), f.id, "sm")}
                <div style="flex:1;min-width:0;">
                  <div class="small" style="font-weight:700;">${f.name} <span class="pos-badge" style="display:inline-flex;width:auto;padding:1px 6px;height:auto;vertical-align:middle;">${f.pos}</span></div>
                  <div class="tiny text-dim">${f.nfl} &middot; ${f.own} owned</div>
                </div>
              </div>
              <p class="tiny text-dim2 mt-8">${f.note} <span style="color:var(--gold)">${f.trend}</span></p>
              ${claimed ? `
                <div class="waiver-actions">
                  <span class="badge badge-gold">Claimed &middot; $${claimed.bid}</span>
                  <button class="btn btn-ghost btn-sm" onclick="APP.removeClaim('${f.id}')">Remove</button>
                </div>
              ` : `
                <div class="waiver-actions">
                  <input class="faab-input" type="number" min="0" max="86" id="bid-${f.id}" placeholder="$${f.suggest}" />
                  <button class="btn btn-ember btn-sm" onclick="APP.placeClaim('${f.id}')">Place Claim</button>
                </div>
              `}
            </div>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  /* ------------------------------------------------------------------ *
   * VIEW: Chat
   * ------------------------------------------------------------------ */

  function viewChat() {
    const msgs = S.chatMsgs[S.chatTab === "league" ? "league" : "dm"];
    window.__scrollChatBottom = true;
    return `
      <div style="margin-top:6px;">
        <div class="segmented">
          <button class="${S.chatTab === "league" ? "active" : ""}" onclick="APP.setChatTab('league')">League</button>
          <button class="${S.chatTab === "dm" ? "active" : ""}" onclick="APP.setChatTab('dm')">DMs &middot; Priya</button>
        </div>
      </div>

      <div class="chat-scroll mt-16">
        ${S.chatTab === "league" ? `
          <div class="glass pinned">
            <span class="badge badge-gold">📌 Pinned</span>
            <div style="flex:1;">
              <div class="small mt-4">${CHAT_LEAGUE[0].text}</div>
              <div class="tiny text-dim mt-4">Marcus &middot; Commish's Corner</div>
            </div>
          </div>
        ` : ""}
        ${msgs.map((m) => chatBubble(m)).join("")}
      </div>
    `;
  }

  function chatBubble(m) {
    const reacts = Object.entries(m.reacts || {});
    return `
      <div class="bubble-wrap${m.mine ? " mine" : ""}">
        ${!m.mine ? crest(m.init, m.name, "sm") : ""}
        <div>
          <div class="bubble">
            ${!m.mine ? `<div class="tiny" style="color:var(--gold);font-weight:700;margin-bottom:2px;">${m.name} <span class="text-dim" style="font-weight:500;">&middot; ${m.team}</span></div>` : ""}
            ${esc(m.text)}
          </div>
          <div class="bubble-meta">${m.time}</div>
          ${reacts.length ? `<div class="reactions">${reacts.map(([e, n]) => `<span class="reaction" onclick="APP.react('${m.id}','${e}')">${e} ${n}</span>`).join("")}</div>` : `<div class="reactions"><span class="reaction" onclick="APP.react('${m.id}','🔥')">+ 🔥</span></div>`}
        </div>
      </div>
    `;
  }

  /* ------------------------------------------------------------------ *
   * VIEW: Player detail
   * ------------------------------------------------------------------ */

  function viewPlayer(id) {
    const p = PLAYERS[id];
    if (!p) return `<p class="mt-16">Player not found.</p>`;
    const trendMax = Math.max(...(p.trend || [1]));
    return `
      <div class="fade-in" style="margin-top:6px;">
        <button class="btn btn-ghost btn-sm" onclick="APP.nav('${S.lastMain}')">${ICO.back} Back</button>
        <div class="glass player-hero mt-12">
          ${crest(p.init, p.id, "lg")}
          <h1>${p.name}</h1>
          <div class="meta">${p.pos} &middot; ${p.nfl}</div>
          <div class="mt-12">${statusBadge(p.status, p.statusNote)}</div>
          <div class="stat-grid">
            <div class="stat-tile"><div class="v" style="color:var(--gold)">${p.actual}</div><div class="k">This week</div></div>
            <div class="stat-tile"><div class="v">${p.proj}</div><div class="k">Projected</div></div>
            <div class="stat-tile"><div class="v">${p.season ? p.season.pg : "-"}</div><div class="k">Pts / gm</div></div>
          </div>
        </div>

        <div class="section">
          <div class="glass card">
            <div class="eyebrow">Live</div>
            <p class="small mt-8">${p.live}</p>
          </div>
        </div>

        <div class="section">
          <div class="section-head"><h2>Last 6 weeks</h2></div>
          <div class="glass card">
            <div class="trend-bars">
              ${(p.trend || []).map((v, i) => `
                <div class="trend-bar">
                  <div class="bar" style="height:${Math.max(6, (v / trendMax) * 100)}%"></div>
                  <div class="wk">${v}</div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>

        <div class="section">
          <div class="glass card">
            <div class="row" style="border:none;padding-top:0;margin-top:0;">
              <div style="flex:1;"><div class="tiny text-dim">Drafted</div><div class="small" style="font-weight:700;">${p.drafted || "Undrafted"}</div></div>
              <div style="flex:1;"><div class="tiny text-dim">Rostered</div><div class="small" style="font-weight:700;">${p.own || "-"}</div></div>
              <div style="flex:1;"><div class="tiny text-dim">Season pts</div><div class="small" style="font-weight:700;">${p.season ? p.season.tot : "-"}</div></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  /* ------------------------------------------------------------------ *
   * VIEW: Profile sheet (bonus overlay)
   * ------------------------------------------------------------------ */

  function viewProfileSheet() {
    return `
      <div class="sheet-backdrop" onclick="APP.closeProfileOuter(event)">
        <div class="sheet glass glass-strong" onclick="event.stopPropagation()">
          <div class="grabber"></div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-12">
              ${crest("T", "tyler-profile", "md")}
              <div><div style="font-weight:700;">Tyler</div><div class="tiny text-dim">Turf Kings &middot; Manager</div></div>
            </div>
            <button class="remove-x" onclick="APP.closeProfile()" aria-label="Close">${ICO.close}</button>
          </div>
          <div class="divider"></div>
          <div class="settings-row">
            <span class="small">Push notifications</span>
            <button class="switch ${S.notif ? "on" : ""}" onclick="APP.toggle('notif')"></button>
          </div>
          <div class="settings-row">
            <span class="small">Sound effects</span>
            <button class="switch ${S.sound ? "on" : ""}" onclick="APP.toggle('sound')"></button>
          </div>
          <div class="settings-row">
            <span class="small">Theme</span>
            <span class="tiny text-dim">Locker Room (warm dark)</span>
          </div>
          <div class="divider"></div>
          <button class="btn btn-ghost btn-block" onclick="APP.signOut()">Sign out</button>
        </div>
      </div>
    `;
  }

  /* ------------------------------------------------------------------ *
   * Public API (used by inline handlers)
   * ------------------------------------------------------------------ */

  window.APP = {
    nav(hash) { location.hash = hash; },
    enter() { location.hash = "#/home"; },
    openPlayer(id) {
      location.hash = "#/player/" + id;
    },
    openProfile() { S.profileOpen = true; render(); },
    closeProfileOuter(e) { if (e.target.classList.contains("sheet-backdrop")) { S.profileOpen = false; render(); } },
    closeProfile() { S.profileOpen = false; render(); },
    signOut() { S.profileOpen = false; location.hash = "#/splash"; },
    toggle(key) { S[key] = !S[key]; render(); },
    setWeek(w) { S.week = w; render(); },
    setLeagueTab(tab) { S.leagueTab = tab; if (tab === "waivers") { location.hash = "#/waivers"; } else { render(); } },
    setChatTab(tab) { S.chatTab = tab; render(); },
    react(id, emoji) {
      const list = S.chatMsgs[S.chatTab === "league" ? "league" : "dm"];
      const m = list.find((x) => x.id === id);
      if (!m) return;
      const key = id + emoji;
      if (S.myReactions[key]) {
        m.reacts[emoji] = Math.max(0, (m.reacts[emoji] || 1) - 1);
        if (!m.reacts[emoji]) delete m.reacts[emoji];
        S.myReactions[key] = false;
      } else {
        m.reacts[emoji] = (m.reacts[emoji] || 0) + 1;
        S.myReactions[key] = true;
      }
      render();
    },
    sendChat() {
      const input = document.getElementById("chat-compose");
      if (!input || !input.value.trim()) return;
      const list = S.chatMsgs[S.chatTab === "league" ? "league" : "dm"];
      list.push({
        id: "u" + Date.now(),
        name: "Tyler",
        team: "Turf Kings",
        init: "T",
        time: "Now",
        text: input.value.trim(),
        mine: true,
        reacts: {},
      });
      input.value = "";
      window.__scrollChatBottom = true;
      render();
    },
    placeClaim(id) {
      const el = document.getElementById("bid-" + id);
      const f = FREE_AGENTS.find((x) => x.id === id);
      const bid = (el && el.value) ? Number(el.value) : f.suggest;
      S.claims.push({ id, bid: bid || f.suggest });
      render();
    },
    removeClaim(id) {
      S.claims = S.claims.filter((c) => c.id !== id);
      render();
    },
  };

  /* ------------------------------------------------------------------ *
   * Boot
   * ------------------------------------------------------------------ */

  if (!location.hash) location.hash = "#/splash";
  render();
})();

</script>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   UNDER THE LIGHTS — liquid glass / broadcast-night design system
   Fixed mobile canvas (390px). No desktop breakpoints, by design.
   ============================================================ */

/* ---------- Reset ---------- */
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

/* ---------- Design tokens ---------- */
:root{
  /* core palette — stadium night, sodium-amber floodlights */
  --void:        #100B07;   /* near-black ground, warm brown-black */
  --void-2:      #17110A;   /* slightly lifted void, for gradients */
  --panel:       #1E160Dcc; /* glass panel fill (translucent) */
  --panel-solid: #1C150E;   /* opaque fallback for reduced-transparency */
  --panel-light: #2A2013;   /* lighter content-card fill, opaque */
  --gold:        #FFB627;   /* primary broadcast accent */
  --gold-dim:    #C98F1D;   /* pressed / secondary gold */
  --live:        #FF3B30;   /* live / urgent accent */
  --turf:        #1F4D33;   /* deep field green, used sparingly */
  --turf-line:   #2B6144;   /* turf yard-line texture */
  --paper:       #F5EFE2;   /* primary text, warm off-white */
  --muted:       #B7AA92;   /* secondary text, warm tan-grey */
  --muted-2:     #8A7D67;   /* tertiary text / captions */
  --line:        rgba(245,239,226,0.10);
  --line-strong: rgba(245,239,226,0.18);
  --shadow-lift: 0 24px 48px -16px rgba(0,0,0,0.65), 0 4px 12px -2px rgba(0,0,0,0.45);
  --shadow-soft: 0 8px 24px -8px rgba(0,0,0,0.5);

  --radius-glass: 28px;
  --radius-card:  20px;
  --radius-sm:    14px;
  --radius-pill:  999px;

  --font-display: 'Bebas Neue', 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-label:   'Barlow Condensed', 'Barlow', sans-serif;
  --font-body:    'Barlow', 'Source Sans 3', -apple-system, sans-serif;

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 40px;
}

/* ---------- Page / device canvas ----------
   The app is designed at a fixed 390px phone canvas. The outer page
   background is a neutral holding-ground so that canvas reads like
   a device screen; it carries no theme meaning of its own. */
html{
  background: #050403;
  color-scheme: dark;
}
body{
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: #050403;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

.device{
  position: relative;
  width: 390px;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--void);
  color: var(--paper);
  isolation: isolate;
}

/* Stadium-night atmosphere: floodlight glows + faint turf grain.
   This lives behind every screen so the glass chrome has something
   rich to blur/refract rather than a flat color. */
.atmosphere{
  position: fixed;
  inset: 0;
  width: 390px;
  left: 50%;
  margin-left: -195px;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(480px 360px at 18% -6%, rgba(255,182,39,0.30), transparent 60%),
    radial-gradient(420px 320px at 100% 8%, rgba(255,59,48,0.14), transparent 60%),
    radial-gradient(600px 500px at 50% 115%, rgba(31,77,51,0.35), transparent 55%),
    linear-gradient(180deg, var(--void-2) 0%, var(--void) 40%, #0B0805 100%);
}
.atmosphere::after{
  /* turf yard-line texture, very subtle, bottom third */
  content:'';
  position:absolute; left:0; right:0; bottom:0; height:42%;
  background-image: repeating-linear-gradient(
    180deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 34px
  );
  mask-image: linear-gradient(180deg, transparent, black 60%);
}

/* ---------- Typography ---------- */
.display{ font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
.label{
  font-family: var(--font-label); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.09em; color: var(--muted);
}
.eyebrow{ font-size: 11px; }
.num{ font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

h1,h2,h3{ margin: 0; font-family: var(--font-display); font-weight: 700; text-wrap: balance; }
p{ margin: 0; }

/* ---------- Layout primitives ---------- */
.screen{
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding-bottom: 118px; /* clears floating tab bar */
}
.px{ padding-left: var(--space-4); padding-right: var(--space-4); }
.stack{ display: flex; flex-direction: column; }
.row{ display: flex; align-items: center; }
.between{ justify-content: space-between; }
.gap-1{ gap: var(--space-1); } .gap-2{ gap: var(--space-2); } .gap-3{ gap: var(--space-3); }
.gap-4{ gap: var(--space-4); } .gap-5{ gap: var(--space-5); } .gap-6{ gap: var(--space-6); }

/* ---------- Liquid glass system ----------
   Applied to navigation, floating chrome, sheets and score bugs.
   Content cards get a lighter touch further down. */
.glass{
  position: relative;
  background: var(--panel);
  backdrop-filter: blur(28px) saturate(170%);
  -webkit-backdrop-filter: blur(28px) saturate(170%);
  border-radius: var(--radius-glass);
  box-shadow: var(--shadow-lift);
  overflow: hidden;
}
/* light-catching edge — a soft diagonal gradient ring, not a flat border */
.glass::before{
  content:'';
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg,
    rgba(255,255,255,0.55) 0%,
    rgba(255,255,255,0.06) 38%,
    rgba(255,255,255,0.02) 60%,
    rgba(255,183,39,0.30) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
/* specular sweep — one deliberate highlight, subtle, not a rainbow */
.glass::after{
  content:'';
  position: absolute;
  top: -40%; bottom: -40%;
  left: -60%;
  width: 40%;
  background: linear-gradient(75deg,
    transparent, rgba(255,255,255,0.16) 45%, rgba(255,255,255,0.26) 50%,
    rgba(255,255,255,0.16) 55%, transparent);
  transform: translateX(0) rotate(0);
  animation: glass-sweep 7s ease-in-out infinite;
  pointer-events: none;
  mix-blend-mode: overlay;
}
@keyframes glass-sweep{
  0%   { left: -60%; }
  38%  { left: 130%; }
  100% { left: 130%; }
}
/* fine-pointer devices: the highlight tracks the cursor instead of
   auto-sweeping — set once JS detects a mouse/trackpad over the nav */
.tabbar.spec-follow::after{
  animation: none;
  left: var(--spec-x, 50%);
  transition: left 0.15s ease-out;
}

/* content cards: lighter glass touch, never sacrificing text contrast */
.card{
  position: relative;
  background: linear-gradient(180deg, rgba(42,32,19,0.86), rgba(28,21,14,0.92));
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-soft);
}
.card-glass{
  background: rgba(30,22,13,0.55);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
}

/* ---------- Top bar ---------- */
.topbar{
  position: sticky; top: 0; z-index: 20;
  margin: var(--space-3) var(--space-4) 0;
  padding: var(--space-3) var(--space-4);
  display: flex; align-items: center; justify-content: space-between;
}
.topbar .wordmark{
  font-family: var(--font-display);
  font-size: 20px; letter-spacing: 0.04em; color: var(--paper);
}
.topbar .wordmark em{ font-style: normal; color: var(--gold); }
.avatar{
  width: 36px; height: 36px; border-radius: var(--radius-pill);
  background: linear-gradient(155deg, var(--gold), var(--gold-dim));
  color: #1B1206; font-family: var(--font-display); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(255,182,39,0.35);
}
.icon-btn{
  width: 44px; height: 44px; border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  color: var(--paper);
}

/* ---------- Bottom tab bar (true glass, floating) ---------- */
.tabbar{
  position: fixed; left: 50%; bottom: 14px;
  transform: translateX(-195px);
  width: 358px;
  z-index: 30;
  padding: 8px;
  display: flex; justify-content: space-between;
}
.tab{
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  min-height: 52px;
  border-radius: 18px;
  color: var(--muted-2);
  font-family: var(--font-label); font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  transition: color 0.2s ease;
}
.tab svg{ width: 21px; height: 21px; }
.tab.active{ color: var(--gold); }
.tab.active .tab-dot{ opacity: 1; transform: scale(1); }
.tab-dot{
  position: absolute; margin-top: 34px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--gold);
  opacity: 0; transform: scale(0.4); transition: all 0.2s ease;
}

/* ---------- Buttons ---------- */
.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-label); font-weight: 700; font-size: 14.5px;
  letter-spacing: 0.03em; text-transform: uppercase;
  transition: transform 0.12s ease, filter 0.12s ease;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{
  background: linear-gradient(155deg, #FFC85A, var(--gold) 55%, var(--gold-dim));
  color: #1B1206;
  box-shadow: 0 10px 24px -8px rgba(255,182,39,0.55);
}
.btn-primary:active{ filter: brightness(0.95); }
.btn-ghost{
  background: rgba(245,239,226,0.08);
  border: 1px solid var(--line-strong);
  color: var(--paper);
}
.btn-live{
  background: linear-gradient(155deg, #FF6A54, var(--live) 60%, #C6281F);
  color: #fff;
  box-shadow: 0 10px 24px -8px rgba(255,59,48,0.5);
}
.btn-block{ width: 100%; }
.btn-sm{ min-height: 38px; padding: 0 14px; font-size: 12.5px; }

/* ---------- Chips / tags / pills ---------- */
.chip{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: var(--radius-pill);
  font-family: var(--font-label); font-size: 11px; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase;
  background: rgba(245,239,226,0.08); border: 1px solid var(--line);
  color: var(--muted);
}
.chip-pos{ background: rgba(255,182,39,0.14); color: var(--gold); border-color: rgba(255,182,39,0.3); }
.chip-live{
  background: rgba(255,59,48,0.16); color: #FF8478; border-color: rgba(255,59,48,0.35);
}
.live-dot{
  width: 7px; height: 7px; border-radius: 50%; background: var(--live);
  box-shadow: 0 0 0 0 rgba(255,59,48,0.6);
  animation: live-pulse 1.6s ease-out infinite;
}
@keyframes live-pulse{
  0%   { box-shadow: 0 0 0 0 rgba(255,59,48,0.55); }
  70%  { box-shadow: 0 0 0 8px rgba(255,59,48,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); }
}

/* ---------- Segmented control ---------- */
.segmented{
  display: flex; padding: 4px; border-radius: var(--radius-pill);
  background: rgba(0,0,0,0.28); border: 1px solid var(--line);
}
.segmented button{
  flex: 1; min-height: 38px; border-radius: var(--radius-pill);
  font-family: var(--font-label); font-weight: 700; font-size: 12.5px;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
}
.segmented button.active{
  background: rgba(255,182,39,0.16); color: var(--gold);
  box-shadow: inset 0 0 0 1px rgba(255,182,39,0.35);
}

/* ---------- Score hero (matchup card) ---------- */
.score-hero{
  padding: var(--space-6) var(--space-5) var(--space-5);
}
.score-hero .teams{
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: var(--space-3);
}
.score-hero .score{
  font-family: var(--font-display); font-size: 52px; line-height: 1;
  color: var(--paper);
}
.score-hero .score.lead{ color: var(--gold); }
.score-hero .vs{
  font-family: var(--font-label); font-size: 12px; color: var(--muted-2);
  text-align: center;
}
.team-col{ display: flex; flex-direction: column; gap: 6px; }
.team-col.right{ align-items: flex-end; text-align: right; }
.team-name{ font-family: var(--font-display); font-size: 17px; letter-spacing: 0.02em; }

.winprob{
  margin-top: var(--space-5);
}
.winprob-track{
  position: relative; height: 8px; border-radius: var(--radius-pill);
  background: rgba(255,59,48,0.35); overflow: hidden;
}
.winprob-fill{
  position: absolute; inset: 0 auto 0 0;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: var(--radius-pill);
  transition: width 0.6s cubic-bezier(.2,.8,.2,1);
}

/* ---------- Standings table ---------- */
.standings-row{
  display: grid; grid-template-columns: 28px 1fr auto auto;
  align-items: center; column-gap: var(--space-3);
  padding: 13px var(--space-4);
  border-bottom: 1px solid var(--line);
}
.standings-row:last-child{ border-bottom: 0; }
.standings-row.user{
  background: linear-gradient(90deg, rgba(255,182,39,0.14), transparent 70%);
  box-shadow: inset 3px 0 0 var(--gold);
}
.rank{ font-family: var(--font-display); font-size: 16px; color: var(--muted-2); }
.standings-row.user .rank{ color: var(--gold); }
.team-meta .name{ font-family: var(--font-label); font-weight: 700; font-size: 14.5px; }
.team-meta .owner{ font-size: 11.5px; color: var(--muted-2); }
.pf-col{ text-align: right; font-size: 13px; color: var(--muted); }
.streak{
  font-family: var(--font-label); font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: var(--radius-pill); text-align:center;
}
.streak.win{ background: rgba(60,200,130,0.16); color: #6FE3A6; }
.streak.loss{ background: rgba(255,59,48,0.16); color: #FF8478; }
.row-detail{
  padding: 0 var(--space-4) var(--space-4);
  font-size: 12.5px; color: var(--muted);
  border-bottom: 1px solid var(--line);
}

/* ---------- Roster rows ---------- */
.roster-row{
  display: grid; grid-template-columns: 40px 1fr auto;
  align-items: center; column-gap: var(--space-3);
  padding: 12px var(--space-4);
  border-bottom: 1px solid var(--line);
}
.roster-row:last-child{ border-bottom: 0; }
.pos-badge{
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-label); font-weight: 700; font-size: 11.5px;
  background: rgba(255,182,39,0.12); color: var(--gold);
  border: 1px solid rgba(255,182,39,0.25);
}
.player-name{ font-family: var(--font-label); font-weight: 700; font-size: 14.5px; }
.player-sub{ font-size: 11.5px; color: var(--muted-2); margin-top: 2px; }
.pts-col{ text-align: right; }
.pts-actual{ font-family: var(--font-display); font-size: 19px; color: var(--paper); }
.pts-proj{ font-size: 10.5px; color: var(--muted-2); }
.pts-actual.live{ color: var(--gold); }

/* ---------- Player detail ---------- */
.player-hero{
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--space-7) var(--space-5) var(--space-5);
}
.player-photo{
  width: 92px; height: 92px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 30px; color: #1B1206;
  background: radial-gradient(circle at 32% 28%, #FFD98A, var(--gold) 55%, var(--gold-dim));
  box-shadow: 0 12px 30px -8px rgba(255,182,39,0.5);
  margin-bottom: var(--space-3);
}
.stat-grid{
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: var(--space-3);
}
.stat-tile{
  padding: var(--space-4) var(--space-2);
  text-align: center; border-radius: var(--radius-sm);
}
.stat-tile .v{ font-family: var(--font-display); font-size: 23px; color: var(--paper); }
.stat-tile .k{ font-size: 10px; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

.sparkline-wrap{ padding: var(--space-4); }

/* ---------- Chat ---------- */
.chat-scroll{ display: flex; flex-direction: column; gap: 10px; padding: var(--space-4); }
.bubble-row{ display: flex; flex-direction: column; max-width: 78%; }
.bubble-row.mine{ align-self: flex-end; align-items: flex-end; }
.bubble-row.theirs{ align-self: flex-start; align-items: flex-start; }
.bubble{
  padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4;
}
.bubble-row.theirs .bubble{
  background: rgba(245,239,226,0.08); border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}
.bubble-row.mine .bubble{
  background: linear-gradient(155deg, rgba(255,200,90,0.9), rgba(255,182,39,0.85));
  color: #1B1206; border-bottom-right-radius: 4px;
}
.bubble-meta{ font-size: 10.5px; color: var(--muted-2); margin: 2px 8px; }
.pinned-banner{
  margin: var(--space-4); padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-card);
  background: rgba(255,182,39,0.10); border: 1px solid rgba(255,182,39,0.3);
}
.chat-input-bar{
  position: fixed; left: 50%; bottom: 92px; transform: translateX(-195px);
  width: 358px; z-index: 25; padding: 8px;
  display: flex; align-items: center; gap: 8px;
}
.chat-input-bar input{
  flex: 1; min-height: 40px; background: transparent; border: 0; outline: none;
  color: var(--paper); font-size: 14.5px; padding: 0 8px;
}
.chat-input-bar input::placeholder{ color: var(--muted-2); }
.send-btn{
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--gold); color: #1B1206;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* ---------- Waivers ---------- */
.waiver-row{
  display: grid; grid-template-columns: 1fr auto;

.waiver-row:last-child{ border-bottom: 0; }
.trend{ font-size: 11px; color: #6FE3A6; }

  background: rgba(6,4,2,0.6);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet{
  width: 390px; padding: var(--space-6) var(--space-5) var(--space-8);
  border-top-left-radius: 32px; border-top-right-radius: 32px;
  border-bottom-left-radius: 0; border-bottom-right-radius: 0;
}
.sheet-handle{
  width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong);
  margin: 0 auto var(--space-5);
}
.bid-input{
  width: 100%; min-height: 56px; border-radius: var(--radius-card);
  background: rgba(0,0,0,0.3); border: 1px solid var(--line-strong);
  color: var(--paper); font-family: var(--font-display); font-size: 28px;
  text-align: center; outline: none;
}
.bid-input:focus{ border-color: var(--gold); }

/* ---------- Splash ---------- */
.splash{
  min-height: 100vh; display: flex; flex-direction: column;
  justify-content: space-between; padding: var(--space-8) var(--space-5) var(--space-6);
  position: relative; z-index: 1;
}
.splash-word{
  font-family: var(--font-display); font-size: 46px; line-height: 0.92;
  letter-spacing: 0.01em; text-align: center;
}
.splash-word em{ font-style: normal; color: var(--gold); }
.splash-clock{
  font-family: var(--font-display); font-size: 15px; letter-spacing: 0.08em;
  color: var(--muted); text-align: center;
}
.splash-clock .t{ color: var(--gold); }
.field-graphic{
  height: 120px; margin: var(--space-6) 0;
  border-radius: var(--radius-card);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 26px),
    linear-gradient(180deg, var(--turf-line), var(--turf));
  position: relative; overflow: hidden;
}
.field-graphic::after{
  content:''; position:absolute; inset:0;
  background: radial-gradient(220px 140px at 50% -20%, rgba(255,255,255,0.25), transparent 70%);
}

/* ---------- Live ticker (NFL slate strip) ---------- */
.ticker-wrap{ overflow: hidden; }
.ticker{
  display: flex; gap: var(--space-3); padding: var(--space-3) var(--space-4);
  overflow-x: auto; scrollbar-width: none;
}
.ticker::-webkit-scrollbar{ display: none; }
.ticker-card{
  flex: 0 0 auto; min-width: 128px; padding: 10px 12px;
  border-radius: var(--radius-sm);
}
.ticker-card .g{ font-family: var(--font-label); font-size: 11px; color: var(--muted); display:flex; justify-content:space-between; }
.ticker-card .g b{ color: var(--paper); font-weight: 700; }
.ticker-card .status{ font-size: 9.5px; color: var(--live); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

/* ---------- Section headers ---------- */
.section-head{
  padding: var(--space-6) var(--space-4) var(--space-3);
  display: flex; align-items: baseline; justify-content: space-between;
}
.section-head h2{ font-size: 20px; letter-spacing: 0.01em; }
.section-head a{ font-family: var(--font-label); font-size: 11.5px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.04em; }

/* ---------- Play-by-play ---------- */
.play-row{
  padding: 12px var(--space-4); border-bottom: 1px solid var(--line);
  display: flex; gap: var(--space-3);
}
.play-row:last-child{ border-bottom: 0; }
.play-clock{ font-family: var(--font-display); font-size: 12px; color: var(--muted-2); width: 52px; flex-shrink: 0; padding-top: 2px; }
.play-text{ font-size: 13.5px; line-height: 1.45; }

.tap{ cursor: pointer; }
.divider{ height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- Accessibility: reduced motion / reduced transparency ---------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }

  .card-glass{
    background: var(--panel-light);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;

  /* ---------------------------------------------------------
     ROUTER
     --------------------------------------------------------- */
  function currentRoute() {
    return window.location.hash || '#/splash';
  }

  function render() {
    var hash = currentRoute();
    var parts = hash.replace('#/', '').split('/');
    var route = parts[0] || 'splash';
    var view = document.getElementById('view');
    var html;

    switch (route) {
      case 'splash':  html = viewSplash(); break;
      case 'home':    html = viewHome(); break;
      case 'matchup': html = viewMatchup(); break;
      case 'team':    html = viewTeam(); break;
      case 'league':  html = viewLeague(); break;
      case 'player':  html = viewPlayer(parts[1]); break;
      case 'waivers': html = viewWaivers(); break;
      case 'chat':    html = viewChat(); break;
      default:        html = viewSplash();
    }

    view.innerHTML = html;
    view.scrollTop = 0;

    if (route === 'chat') {
      var scroller = document.getElementById('chat-scroll');
      if (scroller) scroller.scrollTop = scroller.scrollHeight;
    }
    if (route === 'splash') startKickoffClock();
    bindSpecularPointer();
  }

  /* ---------------------------------------------------------
     EVENT DELEGATION — nav links, toggles, forms
     --------------------------------------------------------- */
  document.addEventListener('click', function (e) {
    var navEl = e.target.closest ? e.target.closest('[data-nav]') : null;
    if (navEl) { window.location.hash = navEl.getAttribute('data-nav'); return; }

    var tabBtn = e.target.closest('[data-set-matchup-tab]');
    if (tabBtn) { state.matchupTab = tabBtn.getAttribute('data-set-matchup-tab'); render(); return; }

    var toggleId = e.target.closest('[data-standings-row]');
    if (toggleId) {
      var id = toggleId.getAttribute('data-standings-row');
      state.standingsOpen = state.standingsOpen === id ? null : id;
      render();
      return;
    }

    if (e.target.closest('[data-toggle-plays]')) {
      state.playFeedExpanded = !state.playFeedExpanded;
      render();
      return;
    }

    var openBid = e.target.closest('[data-open-bid]');
    if (openBid) { state.sheetPlayer = openBid.getAttribute('data-open-bid'); render(); return; }

    if (e.target.closest('[data-close-sheet]')) { state.sheetPlayer = null; render(); return; }

    var submitBid = e.target.closest('[data-submit-bid]');
    if (submitBid) {
      var pid = submitBid.getAttribute('data-submit-bid');
      var amountEl = document.getElementById('bid-amount');
      var amount = amountEl ? parseInt(amountEl.value, 10) || 0 : 0;
      state.myClaims = state.myClaims.filter(function (c) { return c.playerId !== pid; });
      state.myClaims.push({ playerId: pid, bid: amount });
      state.sheetPlayer = null;
      render();
      return;
    }

    if (e.target.closest('[data-send-chat]')) { sendChat(); return; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'chat-input') sendChat();
  });

  function sendChat() {
    var input = document.getElementById('chat-input');
    if (!input || !input.value.trim()) return;
    var now = new Date();
    var h = now.getHours() % 12 || 12;
    var mm = (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
    state.chat.push({ id: state.chat.length + 1, from: 'Tyler', team: 'Turf Kings', mine: true, time: h + ':' + mm + ' ' + (now.getHours() >= 12 ? 'PM' : 'AM'), text: input.value.trim() });
    input.value = '';
    render();
    var scroller = document.getElementById('chat-scroll');
    if (scroller) scroller.scrollTop = scroller.scrollHeight;
    var freshInput = document.getElementById('chat-input');
    if (freshInput) freshInput.focus();
  }

  /* ---------------------------------------------------------
     KICKOFF CLOCK — ticks independently, no full re-render
     --------------------------------------------------------- */
  var clockTimer = null;
  function startKickoffClock() {
    if (clockTimer) clearInterval(clockTimer);
    var target = new Date();
    target.setHours(target.getHours() + 2, 18, 4, 0);
    function tick() {
      var el = document.getElementById('kickoff-clock');
      if (!el) { clearInterval(clockTimer); return; }
      var diff = Math.max(0, target - new Date());
      var h = String(Math.floor(diff / 3600000)).padStart(2, '0');
      var m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      var s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      el.innerHTML = 'NEXT SLATE IN <span class="t">' + h + ':' + m + ':' + s + '</span>';
    }
    tick();
    clockTimer = setInterval(tick, 1000);
  }

  /* ---------------------------------------------------------
     SPECULAR HIGHLIGHT — subtle pointer-follow on fine pointers,
     static (CSS-animated only) on touch. Respects reduced motion.
     --------------------------------------------------------- */
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasFinePointer = window.matchMedia && window.matchMedia('(any-hover: hover) and (any-pointer: fine)').matches;
  function bindSpecularPointer() {
    if (reduceMotion || !hasFinePointer) return;
    var bar = document.querySelector('.tabbar');
    if (!bar || bar.dataset.specBound) return;
    bar.dataset.specBound = '1';
    bar.addEventListener('pointerenter', function () { bar.classList.add('spec-follow'); });
    bar.addEventListener('pointerleave', function () { bar.classList.remove('spec-follow'); });
    bar.addEventListener('pointermove', function (e) {
      var rect = bar.getBoundingClientRect();
      var pct = ((e.clientX - rect.left) / rect.width) * 100;
      bar.style.setProperty('--spec-x', pct + '%');
    });
  }

  /* ---------------------------------------------------------
     BOOT
     --------------------------------------------------------- */
  window.addEventListener('hashchange', render);
  window.addEventListener('DOMContentLoaded', render);
})();

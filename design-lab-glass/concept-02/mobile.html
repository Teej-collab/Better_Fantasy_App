<style>
/* ==========================================================================
   THE WEEKEND — "Command Deck"
   Mobile-first liquid-glass design system. Canvas: 390px. No desktop rules.
   ========================================================================== */

:root {
  /* ---- Core tokens (6 named hexes) ---- */
  --ink:        #070b10;   /* near-black ground, cool undertone */
  --surface:    #121a24;   /* opaque content-layer base */
  --hairline:   #24303d;   /* solid low-contrast divider */
  --text:       #eef3f8;   /* primary text, near-white silver */
  --text-dim:   #8b98a9;   /* secondary text, desaturated */
  --accent:     #45d9ff;   /* THE signal — live / urgent / actionable only */

  /* ---- Derived / functional ---- */
  --accent-rgb: 69, 217, 255;
  --danger:     #c97b86;   /* desaturated, data-only (negative deltas) */
  --positive:   #7fd9a8;   /* desaturated, data-only (positive deltas) */

  --glass-bg:      rgba(15, 22, 30, 0.62);
  --glass-bg-strong: rgba(11, 16, 22, 0.78);
  --glass-border:  rgba(255, 255, 255, 0.14);
  --glass-edge:    linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.12));
  --glass-blur: 28px;
  --glass-sat: 170%;

  --card-bg: rgba(24, 33, 44, 0.46);
  --card-border: rgba(255, 255, 255, 0.08);
  --card-blur: 14px;

  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  color-scheme: dark;
}

/* ---- Reduced transparency fallback: real accessibility requirement ---- */
@media (prefers-reduced-transparency: reduce) {
  :root {
    --glass-bg: var(--surface);
    --glass-bg-strong: #0c131b;
    --glass-blur: 0px;
    --glass-sat: 100%;
    --card-bg: #17212c;
    --card-blur: 0px;
  }
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
body {
  font-family: 'DM Sans', 'IBM Plex Sans', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  min-height: 100dvh;
}
h1, h2, h3, .display {
  font-family: 'Space Grotesk', 'DM Sans', sans-serif;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
p { margin: 0; }
button { font-family: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: rgba(var(--accent-rgb), 0.35); }

/* ==========================================================================
   Canvas — fixed 390px phone-class viewport. This IS the whole design.
   ========================================================================== */
#app-shell {
  max-width: 390px;
  min-width: 390px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  background: var(--ink);
  overflow-x: hidden;
  isolation: isolate;
}

/* HUD schematic backdrop — gives the glass something to refract */
#app-shell::before {
  content: "";
  position: fixed;
  top: 0; left: 50%;
  width: 390px;
  height: 100%;
  transform: translateX(-50%);
  background:
    radial-gradient(480px 320px at 20% -6%, rgba(var(--accent-rgb), 0.16), transparent 60%),
    radial-gradient(420px 300px at 100% 30%, rgba(120, 150, 190, 0.10), transparent 55%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 34px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 34px);
  pointer-events: none;
  z-index: 0;
}

#view {
  position: relative;
  z-index: 1;
  padding-top: calc(64px + var(--safe-top));
  padding-bottom: calc(96px + var(--safe-bottom));
  min-height: 100dvh;
}

/* Splash has no chrome */
#app-shell[data-route="splash"] #view {
  padding: 0;
  min-height: 100dvh;
}

/* ==========================================================================
   Glass primitives
   ========================================================================== */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  position: relative;
  box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.02) inset;
}
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: var(--glass-edge);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.9;
}

/* Specular sweep — the one deliberate "this is glass" moment */
.specular {
  position: absolute;
  inset: -40% -20%;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.14) 47%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.14) 53%, transparent 65%);
  transform: translateX(var(--sweep-x, -30%));
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0.7;
  transition: transform 0.6s ease-out;
}
@media (prefers-reduced-motion: no-preference) {
  .specular.animate { animation: sweep 7s ease-in-out infinite; }
}
@keyframes sweep {
  0%, 100% { transform: translateX(-40%); }
  50% { transform: translateX(40%); }
}
@media (prefers-reduced-motion: reduce) {
  .specular { transform: translateX(-6%); }
}

/* ==========================================================================
   Top status bar
   ========================================================================== */
.topbar {
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 390px;
  padding: calc(10px + var(--safe-top)) 18px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  border-bottom-left-radius: var(--radius-lg);
  border-bottom-right-radius: var(--radius-lg);
  overflow: hidden;
}
.topbar__left { display: flex; align-items: center; gap: 9px; min-width: 0; }
.topbar__back {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border);
  flex: none;
}
.topbar__title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 16px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar__sub {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.topbar__live {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  background: rgba(var(--accent-rgb), 0.12);
  border: 1px solid rgba(var(--accent-rgb), 0.35);
  padding: 5px 10px;
  border-radius: 100px;
  flex: none;
}
.dot-live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px 1px rgba(var(--accent-rgb), 0.9);
}
@media (prefers-reduced-motion: no-preference) {
  .dot-live { animation: pulse 1.8s ease-in-out infinite; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.8); }
}

/* ==========================================================================
   Bottom tab bar — true glass, floating, superellipse-ish radius
   ========================================================================== */
.tabbar {
  position: fixed;
  bottom: calc(10px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: 358px;
  height: 68px;
  border-radius: 30px;
  display: flex;
  align-items: stretch;
  justify-content: space-around;
  z-index: 60;
  overflow: hidden;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-dim);
  min-height: 44px;
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
.tab svg { width: 21px; height: 21px; }
.tab span { font-size: 10px; font-weight: 600; letter-spacing: 0.01em; }
.tab[data-active="true"] { color: var(--text); }
.tab[data-active="true"]::before {
  content: "";
  position: absolute;
  top: 6px;
  width: 32px; height: 32px;
  border-radius: 12px;
  background: rgba(var(--accent-rgb), 0.16);
  z-index: -1;
}
.tab[data-active="true"] svg { color: var(--accent); }

/* ==========================================================================
   FAB
   ========================================================================== */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(88px + var(--safe-bottom));
  width: 52px; height: 52px;
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  z-index: 55;
  color: var(--accent);
  border: none;
}
.fab svg { width: 22px; height: 22px; }

/* ==========================================================================
   Layout / typography helpers
   ========================================================================== */
.screen { padding: 4px 18px 0; display: flex; flex-direction: column; gap: 14px; }
.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.h1 { font-size: 24px; }
.h2 { font-size: 17px; }
.num-xl { font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; letter-spacing: -0.02em; }
.num-lg { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; }
.muted { color: var(--text-dim); }
.accent-text { color: var(--accent); }
.positive { color: var(--positive); }
.negative { color: var(--danger); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.divider { height: 1px; background: var(--hairline); border: none; margin: 2px 0; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700;
  padding: 4px 10px;
  border-radius: 100px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.pill--accent {
  background: rgba(var(--accent-rgb), 0.14);
  border-color: rgba(var(--accent-rgb), 0.4);
  color: var(--accent);
}

/* ==========================================================================
   Cards — lighter glass touch
   ========================================================================== */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(var(--card-blur)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--card-blur)) saturate(140%);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  position: relative;
}
.card--flat {
  background: var(--surface);
  backdrop-filter: none;
  border: 1px solid var(--hairline);
}
.card--tap { -webkit-tap-highlight-color: transparent; }
.card--tap:active { transform: scale(0.985); }

/* Hero live card */
.hero-matchup {
  border-radius: var(--radius-xl);
  padding: 18px 18px 16px;
  overflow: hidden;
}
.hero-matchup__teams {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px;
}
.hero-team { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.hero-team--right { align-items: flex-end; text-align: right; }
.hero-team__name { font-size: 13px; font-weight: 700; }
.hero-team__owner { font-size: 11px; color: var(--text-dim); }
.hero-vs { padding: 0 10px; font-size: 11px; color: var(--text-dim); font-weight: 700; }
.hero-score { font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; }
.winprob-bar {
  height: 8px;
  border-radius: 100px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
  margin-top: 14px;
  display: flex;
}
.winprob-bar__fill {
  background: linear-gradient(90deg, var(--accent), rgba(var(--accent-rgb), 0.55));
  height: 100%;
}
.winprob-bar__rest { background: rgba(255,255,255,0.05); height: 100%; flex: 1; }

/* Sparkline / graph */
.spark { display: block; width: 100%; height: auto; overflow: visible; }
.spark-wrap { position: relative; }

/* Player rows */
.player-row {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 4px;
  min-height: 44px;
}
.player-row__avatar {
  width: 38px; height: 38px;
  border-radius: 11px;
  background: linear-gradient(160deg, #1c2733, #0f1620);
  border: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--text-dim);
  flex: none;
}
.player-row__mid { flex: 1; min-width: 0; }
.player-row__name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-row__meta { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
.player-row__pts { text-align: right; flex: none; }
.player-row__pts .num-lg { display: block; }
.player-row__pts .muted { font-size: 10.5px; }
.slot-tag {
  font-size: 9.5px; font-weight: 700;
  color: var(--text-dim);
  background: rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 2px 5px;
  margin-right: 7px;
  flex: none;
  letter-spacing: 0.03em;
}

/* Buttons */
.btn {
  min-height: 48px;
  border-radius: var(--radius-md);
  border: none;
  font-weight: 700;
  font-size: 14.5px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.98); }
.btn--primary {
  background: linear-gradient(180deg, rgba(var(--accent-rgb),0.95), rgba(var(--accent-rgb),0.8));
  color: #04141c;
}
.btn--ghost {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--card-border);
  color: var(--text);
}
.btn--block { width: 100%; }

/* Splash */
.splash {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: calc(56px + var(--safe-top)) 26px calc(30px + var(--safe-bottom));
  position: relative;
  overflow: hidden;
}
.splash__glow {
  position: absolute;
  top: -120px; left: 50%;
  transform: translateX(-50%);
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(var(--accent-rgb),0.22), transparent 62%);
  pointer-events: none;
}
.splash__brand { position: relative; z-index: 1; text-align: center; margin-top: 30px;}
.splash__mark {
  width: 74px; height: 74px;
  margin: 0 auto 18px;
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
}
.splash__mark svg { width: 34px; height: 34px; color: var(--accent); position: relative; z-index: 1; }
.splash__title { font-size: 28px; letter-spacing: -0.02em; }
.splash__tag { color: var(--text-dim); font-size: 13.5px; margin-top: 6px; }
.splash__panel {
  position: relative; z-index: 1;
  border-radius: var(--radius-xl);
  padding: 20px;
  margin-top: 26px;
}
.splash__stat-row { display: flex; justify-content: space-between; margin-top: 14px; }
.splash__stat { text-align: left; }
.splash__stat .num-lg { display: block; }
.splash__stat .eyebrow { margin-top: 3px; }
.splash__cta { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
.splash__fineprint { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

/* Standings table */
.standings-head {
  display: grid;
  grid-template-columns: 26px 1fr 52px 46px 60px;
  gap: 8px;
  padding: 0 6px 6px;
  font-size: 10.5px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.standings-row {
  display: grid;
  grid-template-columns: 26px 1fr 52px 46px 60px;
  align-items: center;
  gap: 8px;
  padding: 9px 6px;
  border-radius: var(--radius-sm);
  min-height: 44px;
}
.standings-row--me {
  background: rgba(var(--accent-rgb), 0.09);
  border: 1px solid rgba(var(--accent-rgb), 0.3);
}
.standings-rank { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--text-dim); font-size: 13px; }
.standings-team { min-width: 0; }
.standings-team__name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.standings-team__owner { font-size: 11px; color: var(--text-dim); }
.standings-rec { font-size: 12.5px; font-weight: 600; }
.standings-pf { font-size: 12px; color: var(--text-dim); text-align: right; }
.streak-w { color: var(--positive); }
.streak-l { color: var(--danger); }

/* Segmented control */
.segmented {
  display: flex;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--card-border);
  border-radius: 100px;
  padding: 3px;
  gap: 2px;
}
.segmented button {
  flex: 1;
  border: none;
  background: none;
  color: var(--text-dim);
  font-size: 12.5px;
  font-weight: 700;
  padding: 8px 0;
  border-radius: 100px;
  min-height: 44px;
}
.segmented button[data-active="true"] {
  background: rgba(255,255,255,0.1);
  color: var(--text);
}

/* Chat */
.chat-scroll { display: flex; flex-direction: column; gap: 10px; }
.chat-pin {
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  border: 1px solid rgba(var(--accent-rgb),0.3);
  background: rgba(var(--accent-rgb), 0.08);
}
.bubble {
  max-width: 78%;
  padding: 10px 13px;
  border-radius: 16px;
  font-size: 13.5px;
  position: relative;
}
.bubble--them {
  align-self: flex-start;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--card-border);
  border-bottom-left-radius: 5px;
}
.bubble--me {
  align-self: flex-end;
  background: linear-gradient(180deg, rgba(var(--accent-rgb),0.9), rgba(var(--accent-rgb),0.72));
  color: #04141c;
  border-bottom-right-radius: 5px;
  font-weight: 600;

function initials(name) {

function sparkPath(values, w, h, pad) {
  pad = pad == null ? 3 : pad;
  const clean = values.filter(v => v != null);
  const min = Math.min(...clean), max = Math.max(...clean);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (values.length - 1);
  let d = "";
  values.forEach((v, i) => {
    if (v == null) return;
    const x = pad + i * stepX;
    const y = pad + (h - pad * 2) * (1 - (v - min) / range);
    d += (d === "" ? "M" : " L") + x.toFixed(1) + "," + y.toFixed(1);
  });
  return d;
}
function sparkSvg(values, opts) {
  opts = opts || {};
  const w = opts.w || 64, h = opts.h || 24;
  const path = sparkPath(values, w, h);
  const color = opts.color || "var(--accent)";
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function statusPill(status) {
  if (status === "LIVE") return `<span class="pill pill--accent"><span class="dot-live"></span>LIVE</span>`;
  if (status === "BYE") return `<span class="pill">BYE</span>`;
  if (status === "NOT YET") return `<span class="pill">NOT YET</span>`;
  return `<span class="pill">FINAL</span>`;
}

      </div>
    </div>

    <div class="card glass">
      <div class="eyebrow accent-text">Matchup context</div>
      <p style="font-size:13.5px;margin-top:8px;">${p.note}</p>
    </div>

    <div class="card glass">
      <div class="eyebrow">Latest</div>
      <p style="font-size:13.5px;margin-top:8px;">${p.news}</p>
    </div>
  </div>
  ${renderTabbar("")}
  `;
}

function viewNotFound() {
  return `
  ${renderTopbar({ mode: "back", back: "#/home", title: "Not found", sub: "" })}
  <div class="screen"><div class="card glass">That view doesn't exist yet.</div></div>
  ${renderTabbar("")}
  `;
}

/* ---------------------------------- Router ---------------------------------- */
function parseRoute() {
  const hash = location.hash || "#/splash";
  const parts = hash.replace(/^#\//, "").split("/");
  return { hash, parts };
}

function stopLiveTimer() {
  if (state.liveTimerId) { clearInterval(state.liveTimerId); state.liveTimerId = null; }
}
function startLiveTimer() {
  stopLiveTimer();
  state.liveSecondsAgo = 0;
  state.liveTimerId = setInterval(() => {
    state.liveSecondsAgo += 1;
    const sub = document.querySelector(".topbar__sub");
    if (sub) sub.textContent = `${MATCHUP.quarter} · ${MATCHUP.clock} · updated ${state.liveSecondsAgo}s ago`;
  }, 1000);
}

function render() {
  const { hash, parts } = parseRoute();
  const root = document.getElementById("app-shell");
  const view = document.getElementById("view");
  const routeName = parts[0] || "splash";
  root.setAttribute("data-route", routeName);
  stopLiveTimer();

  let html = "";
  switch (routeName) {
    case "splash": html = viewSplash(); break;
    case "home": html = viewHome(); break;
    case "matchup": html = viewMatchup(); startLiveTimer(); break;
    case "team": state.cameFrom = "#/team"; html = viewTeam(); break;
    case "league": state.cameFrom = "#/league"; html = viewLeague(); break;
    case "waivers": html = viewWaivers(); break;
    case "chat": html = viewChat(); break;
    case "player": html = viewPlayer(parts[1]); break;
    default: html = viewNotFound();
  }
  view.innerHTML = html;
  window.scrollTo(0, 0);
  if (routeName === "chat") {
    const scrollEl = view.querySelector(".chat-scroll");
    if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
  }
}

/* ---------------------------------- Interactions ---------------------------------- */
function openBidSheet(id) {
  const p = WAIVERS.find(w => w.id === id);
  state.sheetPlayerId = id;
  state.bidDraft = state.claims[id] || p.suggested;
  state.sheetOpen = false;
  render();
  requestAnimationFrame(() => {
    state.sheetOpen = true;
    const scrim = document.querySelector(".sheet-scrim");
    const sheet = document.querySelector(".sheet");
    if (scrim) scrim.setAttribute("data-open", "true");
    if (sheet) sheet.setAttribute("data-open", "true");
  });
}
function closeBidSheet() {
  const scrim = document.querySelector(".sheet-scrim");
  const sheet = document.querySelector(".sheet");
  if (scrim) scrim.setAttribute("data-open", "false");
  if (sheet) sheet.setAttribute("data-open", "false");
  state.sheetOpen = false;
  setTimeout(() => { state.sheetPlayerId = null; render(); }, 260);
}

function handleAction(el) {
  const action = el.dataset.action;
  const remaining = FAAB_TOTAL - FAAB_SPENT;
  if (action === "matchup-tab") { state.matchupTab = el.dataset.value; render(); }
  else if (action === "team-tab") { state.teamTab = el.dataset.value; render(); }
  else if (action === "open-bid") { openBidSheet(el.dataset.id); }
  else if (action === "close-sheet") { closeBidSheet(); }
  else if (action === "bid-inc") { state.bidDraft = Math.min(remaining, state.bidDraft + 1); updateStepper(); }
  else if (action === "bid-dec") { state.bidDraft = Math.max(1, state.bidDraft - 1); updateStepper(); }
  else if (action === "submit-bid") {
    state.claims[el.dataset.id] = state.bidDraft;
    closeBidSheet();
  }
}
function updateStepper() {
  const val = document.querySelector(".stepper__val");
  if (val) val.textContent = `$${state.bidDraft}`;
}

function handleChatSubmit(e) {
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  state.chat.push({ id: "u" + Date.now(), owner: "Tyler", text, time: "now", mine: true });
  input.value = "";
  render();
}

document.addEventListener("click", (e) => {
  const navEl = e.target.closest("[data-nav]");
  if (navEl) {
    e.preventDefault();
    const target = navEl.getAttribute("data-nav");
    if (target && target !== location.hash) location.hash = target;
    else render();
    return;
  }
  const actionEl = e.target.closest("[data-action]");
  if (actionEl) { handleAction(actionEl); return; }
});
document.addEventListener("submit", (e) => {
  if (e.target && e.target.id === "chatForm") handleChatSubmit(e);
});
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  render();
  setupSpecular();
});

/* ---------------------------------- Specular highlight (glass lensing) ---------------------------------- */
function setupSpecular() {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finePointer = window.matchMedia("(pointer: fine)").matches;
  if (reduceMotion || !finePointer) return; // touch / reduced-motion: stays static
  document.addEventListener("pointermove", (e) => {
    const pct = (e.clientX / window.innerWidth) * 70 - 35;
    document.documentElement.style.setProperty("--sweep-x", pct.toFixed(1) + "%");
  });
}

# Every push and pull request: the backend tests against a throwaway
# Postgres that GitHub starts for this run and throws away after (never
# the production database — no database secret lives in GitHub), plus
# typecheck and lint for the website and the app.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bfa
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The 2026 multi-league migration (454d8edda612) points every
      # existing row at league #1, which production already had. An
      # empty database doesn't, so build up to the leagues table, add
      # a stand-in league #1, then finish. A few tests also lean on
      # production's owner #1 existing, so add a stand-in for that too.
      - name: Build the database from the migrations
        run: |
          alembic upgrade d7deccb620bb
          psql -h localhost -U postgres bfa -v ON_ERROR_STOP=1 -c "
            INSERT INTO users (email) VALUES ('ci-league-one@example.invalid');
            INSERT INTO leagues (name, created_by_user_id, invite_code) VALUES ('League One', 1, 'ci-league-one');"
          alembic upgrade head
          psql -h localhost -U postgres bfa -v ON_ERROR_STOP=1 -c "
            INSERT INTO owners (owner_id, display_name) VALUES (1, 'League One Owner');
            SELECT setval('owners_owner_id_seq', 1);"
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Route types (LayoutProps, PageProps) are generated, not checked in.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

<title>The Clubhouse</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* THE CLUBHOUSE — design tokens & system */
:root{
  --bg:#F4EFE4;
  --bg-elevated:#FBF8F1;
  --surface:#FFFFFF;
  --ink:#1C1712;
  --ink-dim:#6B6255;
  --ink-faint:#98907F;
  --rule:#D8CFBC;
  --rule-strong:#C3B79E;
  --oxblood:#7A2E2E;
  --oxblood-ink:#FFF5F0;
  --brass:#A9832E;
  --forest:#38513F;
  --shadow-card: 0 1px 2px rgba(28,23,18,.06), 0 8px 24px -12px rgba(28,23,18,.18);
  --serif: 'Libre Bodoni', Georgia, serif;
  --sans: 'Public Sans', -apple-system, sans-serif;
  --maxw: 640px;
  --maxw-desktop: 1180px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
h1,h2,h3,h4{font-family:var(--serif);margin:0;font-weight:600;letter-spacing:-.01em;}
p{margin:0;}
::selection{background:var(--oxblood);color:var(--oxblood-ink);}

/* ===== App Shell ===== */
#app-shell{max-width:var(--maxw);margin:0 auto;min-height:100dvh;position:relative;background:var(--bg);}
@media (min-width:1024px){
  #app-shell{max-width:var(--maxw-desktop);}
}

.masthead{
  padding:22px 20px 4px;
  text-align:center;
  border-bottom:1px solid var(--rule);
}
.masthead__kicker{
  font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);display:flex;justify-content:center;gap:10px;margin-bottom:6px;
}
.masthead__kicker span:nth-child(2){color:var(--rule-strong);}
.masthead__title{
  font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:.01em;
  line-height:1;margin-bottom:14px;
}
.masthead__title em{font-style:normal;color:var(--oxblood);}

.contents-strip{
  display:flex;gap:22px;overflow-x:auto;padding:0 20px;scrollbar-width:none;
  border-bottom:1px solid var(--rule);
}
.contents-strip::-webkit-scrollbar{display:none;}
.contents-strip a{
  flex-shrink:0;padding:12px 2px;font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);border-bottom:2px solid transparent;white-space:nowrap;
}
.contents-strip a.active{color:var(--ink);border-bottom-color:var(--oxblood);}

.corner-tab{
  position:fixed;right:18px;bottom:18px;z-index:40;
  background:var(--ink);color:var(--bg-elevated);
  font-family:var(--serif);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  padding:12px 18px;border-radius:2px;box-shadow:0 10px 30px -8px rgba(28,23,18,.45);
  display:flex;align-items:center;gap:8px;
}
.corner-tab svg{width:14px;height:14px;flex-shrink:0;}
@media (min-width:1024px){ .corner-tab{right:calc((100vw - var(--maxw-desktop))/2 + 24px);} }

main#view{padding:0 20px 100px;min-height:60vh;}
@media (min-width:1024px){ main#view{padding:0 32px 100px;} }

/* ===== Page transition ===== */
.screen{animation:pageIn .38s cubic-bezier(.22,.68,0,1) both;}
@keyframes pageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .screen{animation:none;}
}

/* ===== Rules & sections ===== */
.hr{border:none;border-top:1px solid var(--rule);margin:22px 0;}
.hr--yard{
  border:none;height:8px;margin:24px 0;position:relative;
  background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 14px);
}
.section{padding:26px 0;}
.section + .section{border-top:1px solid var(--rule);}
.eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--oxblood);margin-bottom:8px;display:block;
}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;}
.section-head h2{font-size:22px;}
.section-head .more{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);border-bottom:1px solid var(--rule-strong);padding-bottom:1px;}

/* reveal-on-scroll */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;}
.reveal.is-visible{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;transition:none;}}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:.02em;
  padding:13px 26px;border-radius:2px;min-height:46px;
}
.btn--primary{background:var(--ink);color:var(--bg-elevated);}
.btn--primary:active{background:var(--oxblood);}
.btn--outline{border:1px solid var(--ink);color:var(--ink);}
.btn--ghost{color:var(--oxblood);font-family:var(--sans);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;padding:10px 4px;}
.btn--block{width:100%;}

/* ===== Portraits (duotone, no images) ===== */
.portrait{
  position:relative;border-radius:1px;overflow:hidden;background:var(--ink);
  aspect-ratio:3/4;display:flex;align-items:flex-end;
}
.portrait::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(244,239,228,.10), transparent),
    radial-gradient(1.5px 1.5px at 70% 65%, rgba(244,239,228,.08), transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(244,239,228,.10), transparent),
    radial-gradient(1.5px 1.5px at 85% 15%, rgba(244,239,228,.07), transparent),
    linear-gradient(160deg, var(--tone-a,#3B2E28) 0%, var(--tone-b,#1C1712) 100%);
  background-size:60px 60px,70px 70px,50px 50px,65px 65px,100% 100%;
}
.portrait__initials{
  position:relative;z-index:1;color:var(--bg-elevated);font-family:var(--serif);
  font-weight:700;padding:10px 12px;font-size:15px;letter-spacing:.02em;
  text-shadow:0 1px 6px rgba(0,0,0,.4);
}
.portrait--sm{border-radius:1px;}

/* ===== Flip card (Player Detail — the one 3D moment) ===== */
.flip-outer{perspective:1600px;}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.2,.2,1);}
.flip-inner.is-flipped{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1px;overflow:hidden;}
.flip-face--back{transform:rotateY(180deg);background:var(--ink);color:var(--bg-elevated);padding:18px;display:flex;flex-direction:column;gap:10px;}
@media (prefers-reduced-motion: reduce){.flip-inner{transition:none;}}
.flip-hint{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:8px;letter-spacing:.06em;text-transform:uppercase;}

/* ===== Score numerals ===== */
.score-huge{font-family:var(--serif);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.01em;}
@media (min-width:1024px){.score-huge{font-size:88px;}}
.score-mid{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1;}

/* ===== Cards (used sparingly, by design) ===== */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:2px;box-shadow:var(--shadow-card);padding:18px;}
.pullquote{
  border-left:3px solid var(--oxblood);padding:6px 0 6px 18px;margin:20px 0;position:relative;
}
.pullquote::before{
  content:"“";position:absolute;left:6px;top:-18px;font-family:var(--serif);font-size:52px;color:var(--rule-strong);line-height:1;
}
.pullquote p{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--ink);}
.pullquote cite{display:block;margin-top:8px;font-style:normal;font-size:11.5px;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase;}

/* ===== Standings table ===== */
.standings-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);}
.standings-row:last-child{border-bottom:none;}
.standings-row__rank{font-family:var(--serif);font-weight:700;font-size:22px;width:30px;color:var(--ink-faint);}
.standings-row.is-me .standings-row__rank{color:var(--oxblood);}
.standings-row.is-me{background:linear-gradient(90deg, rgba(122,46,46,.05), transparent 60%);margin:0 -12px;padding-left:12px;padding-right:12px;}
.standings-row__meta{flex:1;min-width:0;}
.standings-row__team{font-weight:700;font-size:14.5px;}
.standings-row__owner{font-size:12px;color:var(--ink-dim);}
.standings-row__stats{text-align:right;font-size:12.5px;color:var(--ink-dim);}
.standings-row__stats b{color:var(--ink);font-weight:700;}
.trend{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:8px;}
.trend--up{color:var(--forest);background:rgba(56,81,63,.1);}
.trend--down{color:var(--oxblood);background:rgba(122,46,46,.08);}

/* ===== Matchup ===== */
.matchup-hero{padding:28px 0 10px;text-align:center;}
.matchup-hero__vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 8px;}
.matchup-hero__team{flex:1;max-width:150px;}
.matchup-hero__team .portrait{margin:0 auto 10px;width:64px;}
.matchup-hero__name{font-weight:700;font-size:13px;}
.matchup-hero__record{font-size:11px;color:var(--ink-dim);}
.matchup-hero__divider{font-family:var(--serif);font-size:13px;color:var(--ink-faint);padding-top:20px;}
.winprob-bar{height:3px;background:var(--rule);margin:18px 0 6px;position:relative;overflow:hidden;}
.winprob-bar__fill{position:absolute;inset:0;width:73%;background:var(--oxblood);}
.winprob-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);letter-spacing:.03em;}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--oxblood);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--oxblood);animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.live-dot{animation:none;}}

.lineup-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule);}
.lineup-row:last-child{border-bottom:none;}
.lineup-player{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer;}
.lineup-player--right{flex-direction:row-reverse;text-align:right;}
.lineup-player .portrait{width:32px;flex-shrink:0;}
.lineup-player__name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lineup-player__pos{font-size:10px;color:var(--ink-faint);}
.lineup-player__pts{font-family:var(--serif);font-weight:700;font-size:15px;flex-shrink:0;}
.lineup-slot{font-size:9.5px;color:var(--ink-faint);text-align:center;font-weight:700;letter-spacing:.04em;}

/* ===== My Team roster rows ===== */
.roster-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule);cursor:pointer;}
.roster-row:last-child{border-bottom:none;}
.roster-row .portrait{width:38px;flex-shrink:0;}
.roster-row__body{flex:1;min-width:0;}
.roster-row__name{font-weight:700;font-size:13.5px;}
.roster-row__sub{font-size:11.5px;color:var(--ink-dim);}
.roster-row__pts{text-align:right;flex-shrink:0;}
.roster-row__pts b{font-family:var(--serif);font-size:17px;display:block;}
.roster-row__pts span{font-size:10.5px;color:var(--ink-faint);}
.roster-divider{padding:18px 0 8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);border-top:1px solid var(--rule);margin-top:6px;}

/* ===== Chat ===== */
.chat-thread{display:flex;flex-direction:column;gap:4px;padding:8px 0;}
.bubble-row{display:flex;gap:9px;max-width:84%;margin-top:10px;}
.bubble-row.mine{align-self:flex-end;flex-direction:row-reverse;}
.bubble-row .portrait{width:26px;flex-shrink:0;align-self:flex-end;}
.bubble{border:1px solid var(--rule-strong);background:var(--bg-elevated);padding:9px 13px;border-radius:2px 10px 10px 10px;}
.bubble-row.mine .bubble{border-radius:10px 2px 10px 10px;background:var(--surface);}
.bubble__sender{font-size:10.5px;font-weight:700;color:var(--oxblood);margin-bottom:2px;}
.bubble__text{font-size:13.5px;}
.bubble__time{font-size:9.5px;color:var(--ink-faint);margin-top:5px;}
.pinned-note{background:var(--bg-elevated);border:1px solid var(--brass);border-left:3px solid var(--brass);padding:12px 14px;margin-bottom:16px;font-size:12.5px;}
.pinned-note b{display:block;font-family:var(--serif);font-size:12px;color:var(--brass);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0;background:linear-gradient(var(--bg) 40%, var(--bg));}
.composer input{flex:1;border:1px solid var(--rule-strong);background:var(--surface);border-radius:20px;padding:11px 16px;font-family:var(--sans);font-size:14px;color:var(--ink);}
.composer input:focus{outline:2px solid var(--oxblood);outline-offset:1px;}
.composer button{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg-elevated);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ===== Draft room ===== */
.draft-clock{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--rule);margin-bottom:16px;}
.draft-pick-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);}
.draft-pick-row .portrait{width:32px;}
.draft-pick-row__num{font-family:var(--serif);font-weight:700;color:var(--ink-faint);width:26px;}
.draft-pick-row.is-new{animation:pickFlash 1.1s ease both;}
@keyframes pickFlash{0%{background:rgba(169,131,46,.28);}100%{background:transparent;}}
@media (prefers-reduced-motion: reduce){.draft-pick-row.is-new{animation:none;background:rgba(169,131,46,.15);}}
.avail-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--rule);}
.avail-row__name{font-weight:700;font-size:13px;}
.avail-row__meta{font-size:11px;color:var(--ink-dim);}

/* ===== Gamecast ===== */
.gc-score{display:flex;align-items:center;justify-content:center;gap:28px;padding:20px 0;}
.gc-team{text-align:center;}
.gc-team .portrait{width:52px;margin:0 auto 8px;}
.field-strip{height:64px;background:linear-gradient(180deg,#2E4234,#233428);border-radius:2px;position:relative;overflow:hidden;margin:16px 0;}
.field-strip__ball{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--brass);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(169,131,46,.25);transition:left .6s ease;}
.field-strip__marks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, rgba(244,239,228,.14) 0 1px, transparent 1px 10%);}
.play-row{padding:11px 0;border-bottom:1px solid var(--rule);font-size:12.5px;}
.play-row.is-score{border-left:3px solid var(--brass);padding-left:10px;background:rgba(169,131,46,.06);}
.play-row__meta{color:var(--ink-faint);font-size:10.5px;margin-bottom:2px;}

/* ===== Activity feed ===== */
.activity-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);}
.activity-row__icon{width:30px;height:30px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.activity-row__icon svg{width:14px;height:14px;color:var(--oxblood);}
.activity-row__body{font-size:13px;}
.activity-row__time{font-size:11px;color:var(--ink-faint);margin-top:2px;}

/* ===== Settings ===== */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--rule);}
.toggle{width:38px;height:22px;border-radius:20px;background:var(--rule-strong);position:relative;flex-shrink:0;}
.toggle.on{background:var(--forest);}
.toggle__knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .2s ease;}
.toggle.on .toggle__knob{transform:translateX(16px);}

/* ===== Login ===== */
.login-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:22px;}
.login-screen h1{font-size:46px;line-height:.95;}
.login-screen p{color:var(--ink-dim);max-width:280px;font-size:14px;}

/* ===== Desktop reflow ===== */
@media (min-width:1024px){
  .grid-editorial{display:grid;grid-template-columns:1.6fr 1fr;gap:44px;align-items:start;}
  .matchup-hero__vs{gap:60px;}
  .matchup-hero__team{max-width:220px;}
  .matchup-hero__team .portrait{width:110px;}
  .score-mid{font-size:48px;}
  .lineup-row{grid-template-columns:1fr 60px 1fr;padding:16px 0;}
  .two-col{columns:2;column-gap:40px;}
}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--rule-strong);color:var(--ink-dim);}
.chip--oxblood{border-color:var(--oxblood);color:var(--oxblood);}
.chip--brass{border-color:var(--brass);color:var(--brass);}

.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
</style>
<div id="app-shell">

</div>
<script>
/* THE CLUBHOUSE — app.js — tiny hash router + vanilla renderers */
(() => {
"use strict";

const $view = document.getElementById("view");
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- MOCK DATA ---------------- */
const TEAMS = [
  { id:"blitz", name:"Blitzkrieg Bop", owner:"Marcus", w:5,l:1,t:0, pf:812.4, pa:701.2, trend:"up", init:"BB", tone:["#4a2e22","#1c1712"] },
  { id:"turf",  name:"Turf Kings",     owner:"Tyler",  w:4,l:2,t:0, pf:798.6, pa:733.9, trend:"up", init:"TK", tone:["#5a2626","#1c1712"], me:true },
  { id:"air",   name:"Air Yard Sale",  owner:"Priya",  w:4,l:2,t:0, pf:790.4, pa:744.1, trend:"down", init:"AY", tone:["#2f4a3a","#1c1712"] },
  { id:"band",  name:"Gridiron Bandits",owner:"Sam",   w:4,l:2,t:0, pf:781.2, pa:750.0, trend:"up", init:"GB", tone:["#3a3320","#1c1712"] },
  { id:"zoom",  name:"Legion of Zoom", owner:"Devon",  w:3,l:3,t:0, pf:774.0, pa:760.3, trend:"down", init:"LZ", tone:["#242c3a","#1c1712"] },
  { id:"hail",  name:"Hail Mary Poppins",owner:"Ava",  w:3,l:3,t:0, pf:766.9, pa:762.5, trend:"up", init:"HP", tone:["#40304a","#1c1712"] },
  { id:"rzr",   name:"Red Zone Rejects",owner:"Liam",  w:3,l:3,t:0, pf:758.0, pa:759.9, trend:"down", init:"RR", tone:["#4a2a30","#1c1712"] },

const routes = [
  { pattern:/^login$/, render: renderLogin, chrome:false },
  { pattern:/^home$/, render: renderHome },
  { pattern:/^league$/, render: renderLeague },
  { pattern:/^matchup$/, render: renderMatchup },
  { pattern:/^myteam$/, render: renderMyTeam },
  { pattern:/^player\/(.+)$/, render: renderPlayer },
  { pattern:/^draft$/, render: renderDraft },
  { pattern:/^gamecast$/, render: renderGamecast },
  { pattern:/^chat$/, render: renderChat },
  { pattern:/^standings$/, render: renderStandings },
  { pattern:/^activity$/, render: renderActivity },
  { pattern:/^profile$/, render: renderProfile },
];

function router(){
  let hash = location.hash.replace(/^#\//,"") || "login";
  const found = routes.find(r=>r.pattern.test(hash));
  const match = found ? hash.match(found.pattern) : null;
  const shell = found || routes[0];
  document.getElementById("masthead").hidden = shell.chrome === false;
  document.getElementById("contents-strip").hidden = shell.chrome === false;
  document.getElementById("corner-tab").hidden = shell.chrome === false || hash === "myteam";
  document.querySelectorAll(".contents-strip a").forEach(a=>{
    a.classList.toggle("active", hash.startsWith(a.dataset.route));
  });
  $view.innerHTML = `<div class="screen">${shell.render(match)}</div>`;
  window.scrollTo(0,0);
  wireScreen(hash.split("/")[0]);
  observeReveals();
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

function observeReveals(){
  const els = document.querySelectorAll(".reveal");
  if (reduceMotion() || !("IntersectionObserver" in window)){
    els.forEach(el=>el.classList.add("is-visible"));
    return;
  }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("is-visible"); io.unobserve(e.target); } });
  }, { threshold:.12 });
  els.forEach(el=>io.observe(el));
}

/* ---------------- INTERACTIONS ---------------- */
function wireScreen(name){
  $view.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{ location.hash = "#/" + el.dataset.nav; });
  });
  $view.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const on = el.classList.toggle("on");
      el.setAttribute("aria-checked", String(on));
    });
  });

  if (name === "player"){
    const outer = document.getElementById("flip-outer");
    const inner = document.getElementById("flip-inner");
    if (outer) outer.addEventListener("click", ()=> inner.classList.toggle("is-flipped"));
  }

  if (name === "chat"){
    const input = document.getElementById("chat-input");
    const send = document.getElementById("chat-send");
    const thread = document.getElementById("chat-thread");
    const doSend = () => {
      const text = input.value.trim();
      if (!text) return;
      const now = new Date();
      const msg = { who:"Tyler", mine:true, text, t: now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) };
      CHAT.messages.push(msg);
      thread.insertAdjacentHTML("beforeend", chatBubble(msg));
      input.value = "";
      thread.scrollTop = thread.scrollHeight;
    };
    send.addEventListener("click", doSend);
    input.addEventListener("keydown", (e)=>{ if (e.key === "Enter") doSend(); });
  }

  if (name === "draft"){
    const btn = document.getElementById("draft-sim");
    const list = document.getElementById("draft-picks");
    const onclock = document.getElementById("draft-onclock");
    if (btn) btn.addEventListener("click", ()=>{
      const next = DRAFT_QUEUE.shift();
      if (!next){ btn.disabled = true; btn.textContent = "Draft Complete"; onclock.textContent = "—"; return; }
      const pickNum = DRAFT_MADE.length + 1;
      const rec = { pick:pickNum, team:next.team, player:next.player, pos:next.pos };
      DRAFT_MADE.push(rec);
      list.insertAdjacentHTML("afterbegin", draftRow(rec, true));
      const upcoming = DRAFT_QUEUE[0];
      onclock.textContent = upcoming ? byId(upcoming.team).name : "Draft Complete";
      if (!DRAFT_QUEUE.length){ btn.disabled = true; btn.textContent = "Draft Complete"; }
    });
  }
}

})();

[pytest]
testpaths = tests
asyncio_mode = auto
; asyncpg pools are bound to the event loop that created them (app/db.py's
; get_pool() is a module-level singleton, matching how the app itself runs
; on one long-lived loop). Function-scoped test loops break that pool
; across tests, so share one loop for the whole session instead.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Base44 dev environment — runs the app from cloned source with live reload.
# No external credentials are required to boot; all optional secrets
# (ESPN, Discord, Anthropic, VAPID, Sportradar) are lazy and stay unset.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bfa
      POSTGRES_PASSWORD: bfa
      POSTGRES_DB: bfa
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - pip_cache:/root/.cache/pip
    ports:
      - "8000:8000"
    environment:
      # Local infra credential — generated here, not a user secret.
      DATABASE_URL: postgresql://bfa:bfa@db:5432/bfa
      # Derived from the preview hostname — NOT user secrets. The OAuth
      # callback must be publicly reachable (Discord redirects here),
      # and the backend redirects back to the frontend's public URL
      # after login.
      DISCORD_REDIRECT_URI: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/auth/discord/callback
      FRONTEND_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      CORS_ALLOWED_ORIGINS: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      SESSION_COOKIE_SECURE: "true"
    env_file:
      - ./.env.base44-defaults   # placeholders — app boots without credentials
      - /run/base44/app.env      # platform secrets — LAST, always wins
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install -r requirements.txt
      && alembic upgrade head
      && exec uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Public backend URL — the OAuth login link navigates the browser
      # here directly, and SSR/route-handler calls reach it through the
      # preview proxy.
      NEXT_PUBLIC_API_BASE_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Lets next.config.ts allow the preview's external dev origin.
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      # Bind-mount friendly file watching.
      WATCHPACK_POLLING: "true"
      # The preview runs in a cross-site iframe (app.base44.com →
      # 3000-…base44-preview.app); SameSite=Lax cookies aren't sent
      # cross-site, so session cookies must be SameSite=None; Secure.
      COOKIE_SAMESITE: "none"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "npm install && npx next dev --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  db_data:
  pip_cache:
  frontend_node_modules:
